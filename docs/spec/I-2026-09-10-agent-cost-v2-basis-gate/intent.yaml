schema_version: "1.0"
intent_id: I-2026-09-10-agent-cost-v2-basis-gate
execution_mode: manual
budget: []
intent:
  business_goal: cost_ledger entries and the estimate/calibrate KNN population
    only use agent-cost measurements whose accounting basis is known and
    comparable, whose sessions are exactly attributed to one task, and whose
    dedup quality flags are clean; anything else abstains with
    MIXED_OR_UNATTRIBUTED_USAGE instead of producing a cost amount that looks
    reliable (cost design v3.2 E0-b gate, agent-cost 0.2.0
    producer_version/accounting_basis)
  user_visible_intent: lane usage-import / calibrate persist producer_version and
    accounting_basis from agent-cost measure/v1 payloads, mark an entry
    eligible_for_knn only when the basis is the current one, every session is
    exactly_attributed per the trace ledger, and conflicting_duplicate_groups /
    missing_dedup_identity_rows / source_quality.identity_missing are all zero;
    otherwise eligible_for_knn is false with reason MIXED_OR_UNATTRIBUTED_USAGE
    and no re-measurement under a different basis silently overwrites an
    existing entry
  success:
    - >-
      A measure/v1 payload that carries producer_version and accounting_basis (agent-cost 0.2.0) is
      accepted by the telemetry adapter and both values are persisted on the cost_ledger entry that
      usage-import or calibrate writes; a payload without them (agent-cost 0.1.x) persists
      accounting_basis "unknown" explicitly rather than omitting the field.
    - >-
      eligible_for_knn is false and the entry records an estimate/v2 reason code when any of these
      holds for the measurement behind it: TOKEN_BASIS_MISMATCH when accounting_basis is not the
      current basis (agent-cost-raw-total/v2); MIXED_OR_UNATTRIBUTED_USAGE when
      data_quality.conflicting_duplicate_groups > 0,
      data_quality.missing_dedup_identity_rows > 0, data_quality.source_quality.identity_missing > 0,
      or any session_id of the entry is not exactly_attributed under attribution/v1 (unbound, orphan,
      or bound to more than one task_run); the existing matched-and-fully-priced condition still
      applies on top.
    - >-
      Re-measuring a lane whose existing cost_ledger entry was produced under a different
      accounting_basis never silently overwrites that entry: computeLedgerEntryId keeps its
      (lane, phase, source, pricing_version) parity identity unchanged, the basis mismatch is detected,
      and the new measurement is written as a superseding entry with both bases visible (or refused
      with a diagnostic naming both bases), asserted by a test that fails against the pre-change code.
    - >-
      Every reason that made an entry ineligible is visible in the entry itself and in the calibration
      observation as an estimate/v2 reason code plus a fixed-template detail string (spec.md T-1..T-11),
      and the estimate/v2 abstain output shows the reason code for that candidate; the estimate/v2
      contract itself is not versioned up, and nothing about the reason lives only in stderr.
    - >-
      The existing packages/* test suites stay green, measure/v1 fixtures without the new fields
      still validate, and no new required field is added to the measure/v1 payload contract.
  non_goal:
    - >-
      Changing agent-cost itself (dedup, producer_version and accounting_basis ship in agent-cost
      PR #11) or re-measuring historical cost_ledger entries; 0.1.x-based entries stay as recorded
      and are corrected, if at all, by the ledger owner's correction rows.
    - >-
      Changing computeLedgerEntryId's Python-parity identity or the emit-metrics fail-closed rules
      (ambiguous_session_attribution / unknown_token_kind), which already exist.
    - >-
      Adding a new binding limit: the trace ledger shows 0 sessions bound to more than one task_run
      (160 session_bound events, 2026-09-10); "exactly one task" is enforced through the existing
      attribution/v1 exactly_attributed predicate, not a new guard.
  constraints:
    - >-
      The measure/v1 schema stays passthrough and additive: producer_version and accounting_basis are
      declared as optional fields; nothing in the vendored measure/v1 contract becomes required.
    - >-
      One attribution predicate: eligibility reuses attribution/v1 (deriveBindingRecordsFromTrace /
      audit classification) rather than re-deriving session state from cost_ledger session_ids.
    - >-
      Code edits are made by a Sonnet builder from a spec with fixed acceptance conditions; the
      architect (Codex sol) reviews the spec before implementation and the diff before PR; tests are
      derived by a separate tester from spec.md only.
  primary_user: spec-lane operator running usage-import / calibrate / estimate on
    lanes measured with agent-cost 0.1.x and 0.2.0 side by side
  state_segments: []
  known_affected_behavior:
    - >-
      Every calibration observation recorded before this lane (token_basis agent-cost-raw-total/v1)
      leaves the k-NN population at once, because the current basis moves to agent-cost-raw-total/v2;
      estimate/v2 abstains with INSUFFICIENT_POPULATION more often until new observations accumulate.
      Intended honest consequence, not a regression (spec D3 revised, Known affected behavior 3).
    - >-
      Entries whose sessions were never bound (orphan_usage: 10 sessions in the 2026-09-10 audit) lose
      eligible_for_knn even though their totals are unchanged.
    - >-
      A lane measured only with `lane calibrate` is almost always ineligible: calibrate writes no
      trace events, so its sessions are never exactly_attributed under attribution/v1 (spec Known
      affected behavior 1). Use `lane work bind` + `lane usage-import` to make sessions attributable.
    - >-
      `lane attribution audit`'s measurement_incomplete bucket shrinks (latest usage_imported per
      pair wins, D14) while tokens.total_measured is unchanged (D15).
    - >-
      `lane estimate --adopt` keeps succeeding on a reference-table revision, which now records
      token_basis "unknown" unless --reference-token-basis is given (D21, D25); such a baseline is
      never scored against a v2 observation.
    - >-
      `lane calibrate` prints relative_error_p50 / covered_by_p80 as null with reason
      token_basis_mismatch when the adopted baseline and the observation differ in basis (D22); the
      first calibrate on every pre-existing lane shows this.
    - >-
      A refused usage-import run (basis conflict without --supersede-basis) records nothing, including
      its own measurement failures; the honest failure record is deferred to the operator's re-run and
      the sessions stay "never imported" in the audit until then (D23).
    - >-
      A pre-change binary (spec-lane <= 0.9.x) cannot read a calibration store that contains a
      token_basis_mismatch record or a nullable covered_by_p80; the new binary reads every old
      record. Downgrade is not supported (D26).
    - >-
      `lane evidence export`'s ledger summary gains accounting_bases and accounting_basis_status;
      the summary is basis-unqualified when they span more than one basis or none (RULE-35).
  declared_risk: high
