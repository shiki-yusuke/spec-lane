premise_evidence:
  required: true
  method: data
  reproduced: true
  evidence: >-
    (1) agent-cost 0.1.x overcount confirmed on real transcript 8b283624 (269 assistant rows / 74
    logical messages, cache_read 93.4M vs 27.36M after dedup; agent-cost PR #11) and all 50
    usage_imported trace events in ~/.local/share/lane/trace/events.jsonl were produced by 0.1.x, so
    every current cost_ledger entry rests on an accounting basis that differs from 0.2.0. (2) lane
    attribution audit (2026-09-10, global): exactly_attributed 46, unbound 0, mixed 0, orphan_usage 10,
    measurement_incomplete 1, violations 11, research_eligible false; 113 bound sessions never
    usage-imported. (3) grep of the lane repo finds no handling of producer_version /
    accounting_basis / conflicting_duplicate_groups / missing_dedup_identity_rows / identity_missing;
    calibrate-service.ts:112-134 sets eligible_for_knn = anyMatched && fullyPriced only, so a 0.2.0
    payload with identity_missing rows or an unattributed session is currently eligible.
    (4) computeLedgerEntryId (core/ledger.ts:30-56) keys on (lane, phase, source, pricing_version)
    only, so a re-measurement under a new basis with the same rates would upsert over the old entry.

# premise_evidence:            # <- record this at Phase 1 (gate 1), before writing spec.md.
