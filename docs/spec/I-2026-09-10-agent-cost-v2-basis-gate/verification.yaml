  # for it; spec_digest above will need recomputing against spec.md's corrected text before
  # any reviewer_ack.
  reviewer_ack: null
success_criteria_matrix:
  - criterion: A measure/v1 payload that carries producer_version and
      accounting_basis (agent-cost 0.2.0) is accepted by the telemetry adapter
      and both values are persisted on the cost_ledger entry that usage-import
      or calibrate writes; a payload without them (agent-cost 0.1.x) persists
      accounting_basis "unknown" explicitly rather than omitting the field.
    covered_by: test
    evidence: >-
      packages/schemas/test/agent-cost.test.ts::"AgentCostMeasureResultSchema —
      RULE-01/02 (D1)" > TEST-01/TEST-02 (schema boundary);
      packages/adapters/test/agent-cost-basis-fields.test.ts::"AgentCostTelemetryAdapter
      — RULE-28 basis field bounds (TEST-41/TEST-57)" > "a normal producer_version and
      accounting_basis both pass through unchanged" and "both fields absent still
      passes through (read back as undefined, never rejected)" (telemetry-adapter
      pass-through, both directions); packages/cli/test/usage-import.test.ts::"runUsageImport
      -- I-2026-09-10-agent-cost-v2-basis-gate basis gate" > TEST-01/04/16/17 (0.2.0
      persists both values) and TEST-16 (0.1.x persists accounting_basis 'unknown' as an
      explicit key, producer_version null); packages/cli/test/calibrate.test.ts::"runCalibrate
      -- I-2026-09-10-agent-cost-v2-basis-gate basis gate" > TEST-28 ("a 0.2.0 measurement
      persists accounting_basis and producer_version on both the lane-scope entry and the
      observation") and "TEST-16 (calibrate path)" ("a 0.1.x measurement (no basis fields)
      persists accounting_basis 'unknown' (explicit key) and producer_version null on the
      entry, and 'unknown' on the observation") — both added by the cli tester in response to
      this same consensus-review gap, so calibrate's own persistence is now directly
      asserted, not merely inferred from usage-import's.
    negation_test: >-
      TEST-16's `expect(entry?.accounting_basis).toBe("unknown")` (usage-import path) and
      calibrate.test.ts's "TEST-16 (calibrate path)" `expect(entry).toHaveProperty("accounting_basis")`
      plus `.toBe("unknown")` (calibrate path) are equality/presence assertions that fail
      under the naive alternative (leaving the field undefined/omitted rather than writing
      the literal string), on both write paths this success line names ("usage-import or
      calibrate writes"). No test is separately tagged "must fail against pre-change code"
      for this line, so these equality/presence checks are the negation evidence.
  - criterion: "eligible_for_knn is false and the entry records an estimate/v2
      reason code when any of these holds for the measurement behind it:
      TOKEN_BASIS_MISMATCH when accounting_basis is not the current basis
