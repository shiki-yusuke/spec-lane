cross_check_intent_vs_spec:
  performed_at: 2026-09-14 (Phase 3); re-checked 2026-09-15 after intent.yaml was updated
  finding: "Direction ② (spec/verification implying a stronger condition than
    intent.yaml states): RESOLVED as of 2026-09-15. The 2026-09-14 pass found
    intent.yaml's known_affected_behavior carried only 2 of the 9 consequences
    spec.md's own \"Known affected behavior\" section (lines 1002-1049)
    documents, and recommended the team-lead fold the remaining 7 back in.
    Re-verified directly against intent.yaml on 2026-09-15:
    known_affected_behavior now has exactly 9 entries (node+yaml parse,
    doc.intent.known_affected_behavior.length === 9), item-for-item covering:
    (1) every pre-lane observation excluded from the k-NN population at once;
    (2) orphan-session entries lose eligibility (both pre-existing); (3) a lane
    measured only with `lane calibrate` is almost always ineligible (D7/D9); (4)
    `lane attribution audit`'s measurement_incomplete bucket shrinks under D14
    while token totals stay unchanged (D15); (5) `lane estimate --adopt` keeps
    succeeding on a reference-table revision during the population-empty window
    (D21); (6) `lane calibrate` stops printing a relative error when the adopted
    baseline's basis differs (D22); (7) a refused multi-phase run defers its own
    measurement-failure records until the operator resolves and re-runs (D23);
    (8) a pre-change binary can no longer read a calibration store with the new
    reason value or a null covered_by_p80 (D26); (9) `lane evidence export`'s
    ledger summary gains two keys (RULE-35). No further stronger-condition drift
    found in this pass. Direction ① (an internal inconsistency in
    spec.md/verification.yaml against intent.yaml's success/non_goal/constraints
    text) was not separately re-audited — out of this task's scope both times."
