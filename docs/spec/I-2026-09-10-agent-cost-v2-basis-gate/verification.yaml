cross_check_intent_vs_spec:
  performed_at: "2026-09-14 (Phase 3)"
  finding: >-
    Direction ② (spec/verification implying a stronger condition than intent.yaml states):
    found, already flagged by spec.md itself. intent.yaml's known_affected_behavior carries
    only two consequences (0.1.x entries become KNN-ineligible until re-measured; orphan
    sessions lose eligibility). spec.md's own "Known affected behavior" section (lines
    1002-1049) documents nine consequences of this lane's decisions, of which only those two
    are reflected in intent.yaml — the other seven are not yet folded back: (1) a lane
    measured only with `lane calibrate` is almost always ineligible, because calibrate writes
    no usage_imported trace event (D7/D9); (2) `lane attribution audit`'s
    measurement_incomplete bucket shrinks under D14 while token totals stay unchanged (D15);
    (3) every observation recorded before this lane leaves the k-NN population at once (the
    withdrawn-and-replaced D3, not a gradual exclusion); (4) `lane estimate --adopt` keeps
    succeeding on a reference-table revision during the population-empty window (D21); (5)
    `lane calibrate` stops printing a relative error when the adopted baseline's basis differs
    from the new observation's (D22) — a visible output change for every existing lane; (6) a
    refused multi-phase run does not record its own measurement failures until the operator
    resolves the conflict and re-runs (D23); (7) a pre-change binary can no longer read a
    calibration store containing a record with the new reason value or a null covered_by_p80
    (D26) — declared, not engineered around; (8) a reference-table revision now records
    token_basis "unknown" instead of a basis it had no way to know (D25); (9)
    `lane evidence export`'s ledger summary gains two keys on a `.strict()` schema (RULE-35).
    None of these nine is a regression per spec.md's own framing ("each is the stated cost of
    the gate"), but items (1), (3), (5) and (6) in particular are stronger/more specific
    operational consequences than intent.yaml's two-item list currently discloses to an
    operator reading only intent.yaml. Recommend intent.yaml's known_affected_behavior be
    extended with a condensed form of items (1)-(9) before PR — this is a team-lead-owned
    edit per spec.md's own note ("must be folded back into intent.yaml at Phase 3"). No
    condition elsewhere in spec.md/verification.yaml was found to be internally inconsistent
    with intent.yaml's success/non_goal/constraints text (direction ① not separately
    re-audited here — out of this task's scope).
