success_criteria_matrix:
  - criterion: >-
      A measure/v1 payload that carries producer_version and accounting_basis (agent-cost
      0.2.0) is accepted by the telemetry adapter and both values are persisted on the
      cost_ledger entry that usage-import or calibrate writes; a payload without them
      (agent-cost 0.1.x) persists accounting_basis "unknown" explicitly rather than omitting
      the field.
    covered_by: test
    evidence: "packages/schemas/test/agent-cost.test.ts::TEST-01/TEST-02 (schema boundary);
      packages/cli/test/usage-import.test.ts::TEST-01/04/16/17 (0.2.0 persists both values)
      and ::TEST-16 (0.1.x persists accounting_basis 'unknown' as an explicit key,
      producer_version null)"
    negation_test: "TEST-16's `expect(entry?.accounting_basis).toBe(\"unknown\")` is an
      equality assertion that fails under the naive alternative (leaving the field
      undefined/omitted rather than writing the literal string); no test is separately
      tagged \"must fail against pre-change code\" for this line, so this equality check is
      the negation evidence."
  - criterion: >-
      eligible_for_knn is false and the entry records an estimate/v2 reason code when any of
      these holds for the measurement behind it: TOKEN_BASIS_MISMATCH when accounting_basis
      is not the current basis (agent-cost-raw-total/v2); MIXED_OR_UNATTRIBUTED_USAGE when
      data_quality.conflicting_duplicate_groups > 0, data_quality.missing_dedup_identity_rows
      > 0, data_quality.source_quality.identity_missing > 0, or any session_id of the entry
      is not exactly_attributed under attribution/v1 (unbound, orphan, or bound to more than
      one task_run); the existing matched-and-fully-priced condition still applies on top.
    covered_by: test
    evidence: "packages/core/test/knn-ineligibility.test.ts (TEST-06..12, T-1/T-2 basis
      templates, T-6..T-10 attribution states, TEST-46/47 counter negations); packages/core/
      test/basis-gate-services.test.ts (RULE-11/TEST-56: anyMatched false still ineligible);
      packages/core/test/calibrate-service.test.ts (unpriced tokens still excludes)"
    negation_test: "packages/core/test/knn-ineligibility.test.ts's TEST-46/47 (a counter
      absent, negative, fractional or non-finite each still produces the reason — the
      negation of \"only a positive nonzero integer counts\"); packages/core/test/
      attribution-projection.test.ts's D14 recovery test is explicitly tagged \"must fail
      against an any-unmatched-in-window derivation\""
  - criterion: >-
      Re-measuring a lane whose existing cost_ledger entry was produced under a different
      accounting_basis never silently overwrites that entry: computeLedgerEntryId keeps its
      (lane, phase, source, pricing_version) parity identity unchanged, the basis mismatch is
      detected, and the new measurement is written as a superseding entry with both bases
      visible (or refused with a diagnostic naming both bases), asserted by a test that fails
      against the pre-change code.
    covered_by: test
    evidence: "packages/cli/test/usage-import.test.ts::TEST-19/48 (refusal, all three files
      byte-identical) and ::TEST-20 (--supersede-basis, unchanged ledger_entry_id,
      basis_history appended); packages/core/test/basis-supersession.test.ts
      (planBasisSupersession unit coverage of both branches)"
    negation_test: "TEST-19/48 is explicitly tagged in spec.md's Tests table as \"Must fail
      against pre-change code\" — pre-change code has no conflict detection at all and would
      silently overwrite instead of refusing."
  - criterion: >-
      Every reason that made an entry ineligible is visible in the entry itself and in the
      calibration observation as an estimate/v2 reason code plus a fixed-template detail
      string (spec.md T-1..T-11), and the estimate/v2 abstain output shows the reason code
      for that candidate; the estimate/v2 contract itself is not versioned up, and nothing
      about the reason lives only in stderr.
    covered_by: test
    evidence: "packages/core/test/knn-ineligibility.test.ts::TEST-64 (exact template match,
      no free text besides the bounded accounting_basis value); packages/core/test/
      basis-gate-services.test.ts (RULE-20/TEST-24: excluded_by_reason/reason_codes surface
      the code, decision field set unchanged) and TEST-68 (legacy migration's T-11 detail)"
    negation_test: "No test in this set is tagged \"must fail against pre-change code\" for
      this line specifically. TEST-64's exact-template-equality assertion is the closest
      negation: it would fail if any payload-derived free text (e.g. producer_version) leaked
      into a detail string. This is weaker evidence than S1/S3/S5's explicitly-tagged
      negations — flagged here rather than silently treated as equivalent."
  - criterion: >-
      The existing packages/* test suites stay green, measure/v1 fixtures without the new
      fields still validate, and no new required field is added to the measure/v1 payload
      contract.
    covered_by: test
    evidence: "packages/schemas/test/agent-cost.test.ts::TEST-02 (0.1.x fixture, no new
      fields, still validates); packages/schemas/test/differential.test.ts (regenerated
      generated/*.schema.json accept both pre-change and new-shape fixtures); RULE-01/02 both
      declare the five new fields .optional()"
    negation_test: "TEST-02 would fail if any of the five fields were declared required
      instead of optional (the 0.1.x fixture carries none of them and must still parse).
      Whether the full suite is actually green end-to-end was not run in this verification
