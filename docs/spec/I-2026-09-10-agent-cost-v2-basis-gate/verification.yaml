test_gaps:
  - taxonomy: test_missing
    description: "RULE-13's reader-side negation (an absent knn_ineligibility_reasons key
      must read as not-yet-evaluated, never as zero reasons/eligible) has no dedicated test
      (spec.md's TEST-40). The convention exists only as a code comment; no reader code path
      added in this diff actually branches on the key's absence, since eligible_for_knn is
      always computed and stored at write time."
    location: "packages/schemas/src/calibration.ts:41, packages/schemas/src/lane-state.ts:109"
    priority: low
  - taxonomy: test_missing
    description: "RULE-14 (\"no code re-derives binding state from cost_ledger.session_ids\")
      is verified only by the function signature of deriveKnnIneligibility taking a
      pre-built AttributionProjection; no mutation-style or regression test would catch a
      future call site re-deriving state independently."
    location: packages/core/src/application/calibrate-service.ts
    priority: low
  - taxonomy: test_missing
    description: "RULE-26 / spec.md TEST-37 (\"a phase-scoped entry unioning two task_runs'
      sessions, each exactly attributed, yields []\") has no dedicated test. The existing
      \"two concurrent task_runs in the same phase are aggregated into one ledger entry\"
      test in usage-import.test.ts predates this lane and never inspects
      knn_ineligibility_reasons."
    location: packages/cli/test/usage-import.test.ts:247
    priority: medium
  - taxonomy: test_missing
    description: "RULE-27 / spec.md TEST-39 (snapshot semantics: binding a session after the
      entry was written does not change the stored reasons; a re-run does) has no dedicated
      test anywhere in packages/cli/test/usage-import.test.ts."
    priority: medium
  - taxonomy: test_missing
    description: "spec.md TEST-34 (\"--supersede-basis appears in both commands' help and
      reaches the command\") has no dedicated e2e test. Every existing test
      (usage-import.test.ts, calibrate.test.ts, estimate.test.ts) calls runUsageImport /
      runCalibrate / runEstimate directly with an options object (supersedeBasis: true,
      referenceTokenBasis: ...), bypassing main.ts's commander argv parsing entirely. The
      flags are declared in main.ts:339/380/616 but no test confirms a real `lane
      usage-import --supersede-basis` argv actually reaches the command."
    location: packages/cli/src/main.ts:339,380,616
    priority: medium
  - taxonomy: test_missing
    description: "spec.md TEST-38/44/51 (buildAttributionAuditResult's classification
      recovers under the D14 latest-projection while tokens.total_measured keeps summing
      every in-window event; whole-output byte-identity on a ledger with no recovery in it)
      have no test at the buildAttributionAuditResult level. The D14 fold rules are
      unit-tested in isolation by attribution-projection.test.ts, but
      packages/core/test/attribution.test.ts (which owns buildAttributionAuditResult and its
      pre-existing measurement_incomplete/total_measured tests) has no test referencing this
      lane at all."
    location: "packages/core/src/attribution.ts:429-437, packages/core/test/attribution.test.ts"
    priority: high
  - taxonomy: test_missing
    description: "spec.md TEST-52 (recovery end-to-end: usage-import alone refreshes only the
      ledger entry; the k-NN population is only restored after a matching lane calibrate
      re-run with the same record identity) has no dedicated test in either
      usage-import.test.ts or calibrate.test.ts. D17's two-command recovery claim is
      documented but not exercised end to end."
    priority: medium
  - taxonomy: test_missing
    description: "The second half of spec.md TEST-59 (\"lane next reads that [reference-table]
      predicted value with no new gate\" once the eligible population is empty after the
      basis move) is not freshly asserted — packages/cli/test/next.test.ts is unmodified by
