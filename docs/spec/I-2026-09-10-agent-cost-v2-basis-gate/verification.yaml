spec_consensus:
  spec_ssot_ref: docs/spec/I-2026-09-10-agent-cost-v2-basis-gate/spec.md
  spec_digest: 082672605ba7b886d39b7512250fc9e8d7f7b7ff8b0574ebfdaca0f4939434d8
  verification_digest: ea489c6f832a39afa4588182ad92771730715197f968f7e8e03c825a27b1efb0
  deviations:
    - spec_ref: "spec.md D8/D11 (sol impl review 2 must: overlay lost update)"
      actual: "usage-import and calibrate fold every entry in memory and write the
        done overlay once, and complete every basis plan before the first
        persistence, but there is no per-intent inter-process lock or CAS around
        read -> plan -> write: two concurrent writers on the same intent can
        still lose an update. done-overlay.ts is outside allowed_paths and the
        pre-change per-entry upsert had the same race."
      action: accept
      status: resolved
      rationale: "Accepted for this lane: spec-lane is a single-operator CLI and
        concurrent writers on one intent are an operator error today as before;
        the reorder removes every partial-write path the lane introduced. A
        per-intent lock in done-overlay.ts is recorded as a follow-up
        candidate."
    - spec_ref: spec.md TEST-44 (RULE-34 audit byte-identity)
      actual: TEST-44 pins the audit-result JSON produced by the current
        implementation for a ledger with no recovery event; it was not captured
        from a pre-change binary, so it guards future drift rather than proving
        identity with 0.9.1 output.
      action: accept
      status: resolved
      rationale: "Accepted: the token-sum arithmetic is unchanged (RULE-34, TEST-51
        checks it directly) and the differential suite still compares against
        the Python reference when present; the pin's provenance is stated in the
        test docstring."
  # Document-consistency note (not a deviation): sol's consensus review (reviews/
