      data_quality.conflicting_duplicate_groups > 0,
      data_quality.missing_dedup_identity_rows > 0,
      data_quality.source_quality.identity_missing > 0, or any session_id of the
      entry is not exactly_attributed under attribution/v1 (unbound, orphan, or
      bound to more than one task_run); the existing matched-and-fully-priced
