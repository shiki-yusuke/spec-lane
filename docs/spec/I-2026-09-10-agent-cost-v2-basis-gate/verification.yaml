      accounting_basis differs" (RULE-06); "flags MIXED_OR_UNATTRIBUTED_USAGE with T-3 when
      conflicting_duplicate_groups is non-zero (TEST-09)", "...with T-3 when
      missing_dedup_identity_rows is non-zero (TEST-10)", "...with T-3 when
      source_quality.identity_missing is non-zero (TEST-11)", "...with T-4 when
