success_criteria_matrix:
  - criterion: calibrate writes cohort on a newly recorded observation only when
      profile.estimate.cohort is configured and every tokens > 0 row of
      measurement.total.rows normalizes to exactly one known (agent, model)
      pair; agent_type, model_provider, model_generation and model_id come from
      that pair through a closed normalization table, the three policy digests
      from the profile, and measure_contract_version from core's constant.
    covered_by: test
    evidence: packages/core/test/calibrate-service.test.ts::TEST-01 (both cases);
      packages/cli/test/calibrate.test.ts::TEST-08 --profile with a cohort;
      packages/core/test/model-cohort.test.ts::it.each closed table (TEST-09);
      estimator-v2.ts exports MEASURE_CONTRACT_VERSION used by calibrate-service
    negation_test: packages/core/test/calibrate-service.test.ts::TEST-06
      (cohortConfig undefined -> no cohort);
      packages/core/test/calibrate-service.test.ts::TEST-02 (two pairs -> no
      cohort); packages/core/test/model-cohort.test.ts::rejects unlisted keys
  - criterion: An observation whose tokens > 0 rows span more than one (agent,
      model) pair, or contain a null or unknown agent or model, gets no cohort
      and is recorded eligible_for_knn false with MIXED_OR_UNATTRIBUTED_USAGE
      plus one fixed-template detail built only from allowlisted model keys, the
      literals claude / codex / null / other and integers (never a raw payload
      string); no rounding to a dominant model and no per-session split,
      asserted by tests that fail against the pre-change code.
    covered_by: test
    evidence: packages/core/test/calibrate-service.test.ts::TEST-02 (3 cases),
      TEST-03 it.each, TEST-05;
      packages/core/test/model-cohort.test.ts::deriveCohortIdentity detail
      templates + RULE-39 case; TEST-02 asserts
      reasons=[MIXED_OR_UNATTRIBUTED_USAGE] and eligible_for_knn false where the
      pre-change code produced [] / true
    negation_test: "packages/core/test/model-cohort.test.ts::RULE-39: no raw model
      or agent string ever reaches a detail line (a raw key in any detail
      fails); packages/core/test/calibrate-service.test.ts::TEST-02 asserts
      cohort undefined and no 'dominant' identity"
  - criterion: "When profile.estimate.cohort is not configured and the identity is
      resolved, calibrate records the observation exactly as before (no cohort,
      eligibility unchanged); an unresolved identity is ineligible regardless of
      the profile; and no observation recorded earlier is ever backfilled: the
      schema's never-backfilled rule stays, and a re-run whose cohort presence
      would differ from the existing record exits 1 without writing."
    covered_by: test
    evidence: packages/core/test/calibrate-service.test.ts::TEST-06 (field-for-field
      pre-change observation);
      packages/core/test/calibrate-service.test.ts::TEST-14 (unresolved identity
      ineligible with cohortConfig undefined);
      packages/cli/test/calibrate.test.ts::TEST-15 both cases (exit 1 +
      byte-identical file; same-presence exit 0);
      packages/schemas/src/calibration.ts unchanged (never-backfilled rule
      retained)
    negation_test: "packages/cli/test/calibrate.test.ts::TEST-15: a cohort-less
      record cannot be re-measured into one with a cohort (exit 1, nothing
      written)"
  - criterion: "estimate/v2 treats a candidate as cohort-matched only when every
      cohort field equals the target's: agent_type, model_provider,
      model_generation or model_id differing yields MODEL_GENERATION_MISMATCH, a
      differing routing, prompt or execution digest or measure_contract_version
      yields ROUTING_PROFILE_MISMATCH, with no new reason code and no
      estimate/v2 contract version change."
    covered_by: test
    evidence: packages/core/test/estimator-v2.test.ts::'a differing %s yields %s'
      it.each over all 8 fields; 'a missing cohort yields
      MODEL_GENERATION_MISMATCH'; 'model before routing'; 'basis first,
      unchanged'; TEST-12 eligible case; estimate-v2.ts (forbidden path)
      unchanged in diff; ESTIMATE_V2_REASON_CODES unchanged
    negation_test: "packages/core/test/estimator-v2.test.ts::TEST-12: no field
      differing -> null (eligible) (a full match must not be excluded); the
      it.each rows fail if any field is skipped by classifyCandidateExclusion"
  - criterion: design.md records the split rule, the no-backfill rule and the
      attribution scope declaration (an observation covers the sessions bound
      through lane work; changing that scope rotates execution_profile_digest),
      profiles/generic.profile.yaml stays without a cohort, and all packages/*
      test suites, typecheck and biome stay green.
    covered_by: diff
    evidence: "docs/design.md §5.1 paragraph: split rule, no-backfill rule,
      attribution scope declaration (worker-only; widening rotates
      execution_profile_digest);
      packages/core/test/calibrate-service.test.ts::'loads with estimate.cohort
      undefined' (TEST-11); MV-02 full acceptance run green 2026-10-15 (re-run
      of the two touched files after the sol review: core calibrate-service 30,
      cli calibrate 31, biome + tsc clean)"
    negation_test: packages/core/test/calibrate-service.test.ts::TEST-11 fails if
      profiles/generic.profile.yaml gains estimate.cohort; biome / tsc / vitest
      exit non-zero on any regression (MV-02)
cross_check_intent_vs_spec:
  performed_at: 2026-10-15 (Phase 3, after the Opus 5.5 headless implementation
    and the full acceptance run)
  finding: "Direction (2) performed: spec.md D8/RULE-14 (re-run guard exit 1 when
    cohort presence differs), D11/RULE-13 (stderr warning on profile/derived
    identity mismatch) and D5 (unresolved identity ineligible regardless of
    cohortConfig) were already folded into intent.yaml success lines 3 and 2
    during the sol r1/r2 spec reviews; verification.yaml adds nothing stronger.
    RULE-13's warning is a diagnostic, not a new acceptance condition, so
    intent.yaml is not widened for it. Cross-check table PATH-01..08 re-verified
    against the final diff: PATH-02 ledger unchanged (TEST-10), PATH-05
    migrate-legacy-ledger untouched, PATH-06 fixtures green (TEST-12), PATH-07
    default resolution (TEST-08). No stale rows."
