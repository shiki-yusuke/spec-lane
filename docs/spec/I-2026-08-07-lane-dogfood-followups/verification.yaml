schema_version: "1.0"
intent_id: I-2026-08-07-lane-dogfood-followups
test_matrix:
  - ears_rule: Rule 1 (--paths documented as repeatable)
    test_type: manual
    test_name: Manual read of the updated skills/lane/SKILL.md text --
      documentation-only, no executable test possible
    status: existing
  - ears_rule: Rule 2 (taxonomy enum documented)
    test_type: manual
    test_name: Manual read of the updated skills/lane/SKILL.md text, cross-checked
      against packages/schemas/src/taxonomy.ts's own KnowledgeTaxonomySchema (10
      values, exact match confirmed)
    status: existing
  - ears_rule: Rule 3 (schema validation failure produces a formatted message)
    test_type: unit
    test_file: packages/cli/test/validate.test.ts
    test_name: returns exitCode 2 with a formatted message when critic.yaml has an
      applicable lens missing finding/taxonomy / uses an unrecognized lens_id /
      puts decision on a per-lens entry; formats an invalid taxonomy value as
      one line per issue naming the field path
    status: added
  - ears_rule: Rule 4 (non-schema errors are unaffected)
    test_type: unit
    test_file: packages/cli/test/validate.test.ts
    test_name: still propagates (does not format) a non-schema error, e.g.
      syntactically invalid YAML
    status: added
test_gaps:
  - taxonomy: manual-verification-required
    description: Rules 1-2 are documentation-only (skill wording); there is no
      executable test that can assert prose is correct, only human review
      against the actual CLI --help output and the schema's own enum.
    location: skills/lane/SKILL.md
    priority: low
manual_verification:
  - id: skill-doc-read
    description: Read the updated skills/lane/SKILL.md knowledge-query and
      critic.yaml passages and confirm they match `lane knowledge-query
      --help`'s actual --paths behavior and packages/schemas/src/taxonomy.ts's
      actual 10-value enum.
    expected_status: pass
goal_stopping_condition:
  - pnpm biome check . / pnpm -r run typecheck / pnpm -r run build /
    dependency-cruiser / pnpm -r run test all green
  - All 4 intent.intent.success lines have a corresponding
    success_criteria_matrix row with real evidence
  - PR opened against the feature branch, containing a real, reviewable diff
