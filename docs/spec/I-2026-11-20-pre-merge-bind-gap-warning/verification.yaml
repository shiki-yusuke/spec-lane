success_criteria_matrix:
  - criterion: When this repo has exactly one candidate -- a lane whose lane-state
      intent_id matches, whose status is running and current_phase is 2_spec or
      3_implement, with an active-work entry for that intent whose phase equals
      current_phase (a bounded proxy for "in progress"; task_runs are never
      closed) -- and the given session_id has no session_bound event at all,
      `lane work check` prints one warning naming the session and the intent
      plus the command `lane work bind --intent=<id> --task-run=<id>
      --session-id=<session> --agent=<agent>`, and exits 0. The command is
      printed only when every id matches ^[A-Za-z0-9][A-Za-z0-9._:-]*$ and
      running it from the check's own process cwd would resolve the same
      active-work file and spec dir as the candidate entry (asserted end-to-end
      by executing the printed command); otherwise the warning names the intent
      without a command. When the session is bound to a different task run
      (whether or not it is also bound to this one), a diagnostic is printed and
      no bind command is suggested (binding again would make the observation
      mixed); when it is bound only to this task run nothing is printed. Tests
      cover each branch.
    covered_by: test
    evidence: "packages/cli/test/work-check.test.ts::TEST-01: sole unbound candidate
      at 2_spec prints the exact raw --flag=value bind command; ::TEST-13:
      matching plus conflicting facts -> the different-task diagnostic wins;
      ::TEST-15: executing the exact printed command from the check cwd binds
      the session; ::TEST-18: an unreadable done overlay -> warning without a
      command (bind refuses it too)"
    negation_test: TEST-01/13/15/18 assert absence of the command for bound, mixed,
      context-mismatched, and bind-refused cases.
  - criterion: The session_id and agent can be given as flags or read from the hook
      JSON on stdin (Claude Code and Codex SessionStart payload `session_id`);
      with neither, or with malformed stdin, the command prints nothing and
      exits 0 (asserted by tests).
    covered_by: test
    evidence: "packages/cli/test/work-check.test.ts::TEST-03: identity from flags or
      hook JSON, flags override JSON; ::TEST-16: one identity flag + a
      never-closing stdin pipe exits 0 silently and promptly"
    negation_test: TEST-03 and TEST-16 assert malformed, absent, oversized, and
      non-closing stdin inputs remain silent with exit 0.
  - criterion: With no lane at 2_spec or 3_implement, the command prints nothing;
      with two or more such lanes it names each candidate instead of guessing
      one; it never writes trace events, lane-state.json or any other file
      (asserted by a test comparing the spec dir and trace store before and
      after).
    covered_by: test
    evidence: "packages/cli/test/work-check.test.ts::TEST-02: zero, one, multiple,
      malformed and read-failure checks write nothing anywhere; ::TEST-04: two
      eligible lanes yield one ambiguity line naming both, with no command"
    negation_test: TEST-02 snapshots filesystem/data state and TEST-04 rejects zero
      and multi-candidate command output.
  - criterion: Existing `lane work start|bind|run`, `lane validate`, `lane advance`
      and `lane calibrate` behavior and output are unchanged (existing tests
      stay green).
    covered_by: test
    evidence: "packages/cli/test/work-check-characterization.test.ts::TEST-06: fixed
      fixture sequence matches the pre-feature snapshot byte for byte"
    negation_test: TEST-06 compares fixed pre-feature stdout, stderr, and
      exit-status snapshots.
  - criterion: All packages/* test suites, typecheck and biome stay green; CHANGELOG
      has an Unreleased entry and the README/docs show a SessionStart hook
      example for Claude Code and Codex.
    covered_by: test
    evidence: "packages/cli/test/work-check-docs.test.ts::TEST-07: root scripts
      define pnpm test, typecheck and lint (Biome); ::TEST-10: README has Claude
      Code and Codex hook examples, explicit agents, the safe form and the cwd
      limitation"
    negation_test: TEST-07/10 assert required scripts and release documentation content.
cross_check_intent_vs_spec:
  performed_at: 2026-11-20 (Phase 3 final-diff direction 2 cross-check)
  finding: "Direction 2 checked final implementation/test behavior against intent
    success lines. The review-driven behaviors (bounded/TTY-skipped stdin in
    TEST-16, wrapper suppression ordering in TEST-19, bind-entry replay
    rejection in TEST-21, and bind-gate command eligibility in TEST-18) remain
    within intent success lines 1-2. LANE_WORK_TASK_RUN is intentionally kept as
    an additive child environment variable: removing it reintroduces the
    wrapped-Codex double-bind race; TEST-20 supplies differential evidence that
    claude and codex children which ignore it retain byte-identical stdout,
    stderr, and exit status. Spec §4 is stale for the new runWorkRun child-env
    PATH and is recorded above."
