test_gaps:
  - taxonomy: accepted_limitation
    description: With two or more Q1 candidates, the ambiguity warning is shown even
      to a session already bound to one candidate. This is accepted because
      RULE-03 requires ambiguity before guessing; no session-specific binding
      suppression is applied to a multi-candidate set.
    location: spec.md RULE-03 / packages/cli/src/commands/work.ts
    priority: low
  - taxonomy: accepted_limitation
    description: Any session_bound event for the supplied session_id in the global
      ledger, including one from another repository or a finished intent, yields
      the no-command mixed-attribution diagnostic when it names a different task
      run. This is the accepted spec decision to avoid mixed attribution.
    location: spec.md Q4, D2, RULE-01 / packages/cli/src/commands/work.ts
    priority: low
  - taxonomy: spec_matrix_staleness
    description: "Spec §4 DEP × PATH matrix has no row for the final
      implementation's runWorkRun child-environment path (LANE_WORK_TASK_RUN).
      TEST-17 covers the path: a wrapped child check is silent before
      thread.started and the parent environment is restored. The matrix should
      gain a PATH row in a future spec revision."
    location: spec.md §4 / packages/cli/src/commands/work.ts::runWorkRun
    priority: low
