success_criteria_matrix:
  - criterion: premise_evidence をゲート通過後にゲート非通過の値へ改変すると advance --phase 5_done
      が非ゼロで終了し、done overlay を作らず、phase 状態を変えない
    covered_by: test
    evidence: "packages/cli/test/promotion-invariants.test.ts asserts exit code !=
      0, done overlay absent, and lane-state byte-identical plus current_phase
      unchanged. Reproduced by hand against the built binary (MV-1): exit 3, no
      overlay, phase still 4_verify."
    negation_test: Nonzero exit alone is asserted separately from the two
      side-effect assertions, so an implementation that blocked but still wrote
      the overlay would fail. Verified by injection that the test can go red
      (MV-4).
  - criterion: 正しい証拠に戻すと同じ advance --phase 5_done が成功する
    covered_by: test
    evidence: "The same test restores the evidence and re-runs the identical
      command, asserting exit 0 and the overlay now exists. Reproduced by hand
      (MV-2): exit 0, phase 5_done."
    negation_test: If promotion refused unconditionally, this half fails -- so the
      pair rules out a gate that simply always blocks.
  - criterion: 昇格時に再評価するのは「最終状態で成立していなければならない述語」であり、歴史上の全ゲートを盲目的に再実行しない
    covered_by: test
    evidence: "packages/core/test/gate-applies-to-matrix.test.ts covers the new
      trigger for every gate. Measured (MV-3): 5 gates apply to promotion;
      designEstablishmentGate and designDecisionGate do not."
    negation_test: The matrix is exhaustive over its GATES const, so a gate that
      started applying to promotion without being intended to would change the
      matrix and fail.
  - criterion: lane 開始時に gate_ruleset_version
      を記録し、昇格はその版の契約の下で評価する。インストール済みバイナリがその版を扱えない場合は明示的な移行を要求し、黙って新ルールで再解釈しない
    covered_by: test
    evidence: gate_ruleset_version is stamped at lane start; a mismatch is
      fail-closed and requires --ack-ruleset-migration; an absent version warns
      with text that names what is being assumed.
    negation_test: The mismatch path is asserted as an error, and the absent path as
      a warning that does not block -- so collapsing the two into one behaviour
      fails one of them. See cross_check_intent_vs_spec for why absent is a
      warning.
  - criterion: 各ゲート通過時の意味的スナップショットを保持し、弱体化した場合のみ焦点を絞った劣化 diff と書面の理由を要求する（良性の編集に再承認を要求しない）
    covered_by: test
    evidence: "gate_snapshots are captured at each crossing; promotionWeakeningGate
      diffs snapshot vs current and emits a focused downgrade diff ('method
      weakened: live -> code-only'), requiring a rationale only for a
      weakening."
    negation_test: The benign-edit test asserts the gate does NOT fire on an edit
      that weakens nothing, and its failure mode was verified by injecting an
      unconditional finding (4 red, then 4 green on restore). Without that,
      'only when weakened' would be an untested claim.
  - criterion: --design を渡さない既存 lane を含め、既存の全テストが回帰なしで通る
    covered_by: test
    evidence: 929 tests pass (schemas 160 / core 523 / adapters 45 / cli 201)
      against an 896 baseline; no existing test modified except
      gate-applies-to-matrix.test.ts, which was extended rather than changed.
    negation_test: The suite includes the pre-existing lanes and fixtures that reach
      5_done without a recorded ruleset version -- had absence been made an
      error, those would have failed, which is the concrete reason it is a
      warning.
cross_check_intent_vs_spec:
  performed_at: 2026-08-20 (Phase 4)
  finding: "Direction 2 performed. One discrepancy found and intent.yaml
    deliberately left unchanged: success line 4 says the installed binary must
    'require an explicit migration' when it cannot handle a recorded ruleset
    version, and the implementation is stricter than the line reads -- a
    mismatched version is fail-closed and needs --ack-ruleset-migration, while
    an ABSENT version is a warning. The line is not weaker in a way that would
    let a non-conforming implementation pass, because the case it describes (a
    version exists and does not match) is exactly the fail-closed one. The
    absent-version case was not contemplated when the line was written; it is
    recorded in the test_matrix note rather than by rewriting the criterion
    after the fact."
