schema_version: "1.0"
intent_id: I-2026-08-20-promotion-invariants
test_matrix:
  - ears_rule: promotion-trigger
    test_type: unit
    test_file: packages/core/test/gate-applies-to-matrix.test.ts
    status: added
    note: The applies-to matrix is extended to the new trigger for every gate in its
      GATES const, so a gate added later cannot quietly skip registration -- the
      same 'registered but not wired' trap this repo has hit before.
  - ears_rule: premise-at-promotion
    test_type: integration
    test_file: packages/cli/test/promotion-invariants.test.ts
    status: added
    note: "Each is the chain-probe's exact tamper, inverted: weaken after the gate
      that required good values already passed, assert nonzero exit AND no done
      overlay AND unchanged phase, then restore and assert success. Nonzero exit
      alone would not show the absence of side effects."
  - ears_rule: success-criteria-at-promotion
    test_type: integration
    test_file: packages/cli/test/promotion-invariants.test.ts
    status: added
    note: "Each is the chain-probe's exact tamper, inverted: weaken after the gate
      that required good values already passed, assert nonzero exit AND no done
      overlay AND unchanged phase, then restore and assert success. Nonzero exit
      alone would not show the absence of side effects."
  - ears_rule: spec-consensus-at-promotion
    test_type: integration
    test_file: packages/cli/test/promotion-invariants.test.ts
    status: added
    note: "Each is the chain-probe's exact tamper, inverted: weaken after the gate
      that required good values already passed, assert nonzero exit AND no done
      overlay AND unchanged phase, then restore and assert success. Nonzero exit
      alone would not show the absence of side effects."
  - ears_rule: weakening-diff-negation
    test_type: integration
    test_file: packages/cli/test/promotion-invariants.test.ts
    status: added
    note: "An edit that weakens nothing must NOT demand a rationale. Verified by
      injection: forcing the weakening finding unconditionally turned all four
      tests red; restoring turned them green."
  - ears_rule: ruleset-version
    test_type: unit
    test_file: packages/core/src/gate.ts (gateRulesetVersionGate)
    status: added
    note: Absent version is a warning whose text names the consequence ('evaluating
      it under the installed binary's current ruleset with no way to confirm
      that matches') rather than passing silently; a present-but-mismatched
      version is fail-closed and needs an explicit migration ack.
  - ears_rule: no-regression
    test_type: regression
    test_file: whole suite
    status: added
    note: 929 tests (schemas 160 / core 523 / adapters 45 / cli 201) against an 896
      baseline.
test_gaps:
  - taxonomy: scope_ambiguity
    description: "The weakening rationale is one string per promotion attempt, not
      per finding. With several simultaneous weakenings, a single sentence can
      stand in for all of them. Left as-is deliberately: splitting it now would
      be building for a problem not yet observed. Revisit if a real lane
      produces multiple findings at once."
    location: packages/core/src/gate.ts (promotionWeakeningGate)
    priority: low
  - taxonomy: architecture_violation
    description: "That test slices gate.ts POSITIONALLY (between
      designEstablishmentGate and GateEvaluation) to decide which diagnostics
      must be catalog-backed, so a new gate placed in that range is swept up as
      a design-gate message and fails. Worked around here by placing the two new
      gates before designEstablishmentGate -- purely positional, no logic
      change. The positional slicing itself is the defect and will recur for the
      next gate. Ticketed separately; not fixed in this lane. RESOLVED on
      2026-08-20 -- the positional slice was first replaced by
      membership-by-gate-id, and then the scan was retired entirely in favour of
      the CatalogBackedDesignMessage type. Gate placement no longer affects any
      design-track check, and the workaround in this lane is no longer
      load-bearing."
    location: packages/cli/test/design-message-catalog.test.ts
    priority: medium
manual_verification:
  - id: MV-1
    description: "Re-ran the original chain-probe sequence against the built binary
      on a fresh lane: honest premise, pass 1_intent->2_spec, weaken to
      method:code-only/reproduced:false, attempt 5_done."
    expected_status: "observed: exit code 3; done overlay absent; current_phase
      still 4_verify; diagnostic named both [premise_evidence] and
      [promotion_weakening] with the focused downgrade diff 'method weakened:
      live -> code-only' and 'reproduced weakened: true -> false'"
  - id: MV-2
    description: Restored the correct evidence and re-ran the identical command.
    expected_status: "observed: exit code 0; overlay created; current_phase 5_done"
  - id: MV-3
    description: "Confirmed the promotion trigger does NOT blindly re-run every
      historical gate: designEstablishmentGate and designDecisionGate do not
      apply to it."
    expected_status: "observed: 5 gates apply to promotion (premise, success
      criteria, spec consensus, ruleset version, weakening); the 2 design gates
      do not"
  - id: MV-4
    description: "Falsification of the benign-edit test itself: injected an
      unconditional weakening finding and re-ran."
    expected_status: "observed: 4 failed with the injection, 4 passed after
      restoring -- the test's failure mode is exercised, not assumed"
  - id: MV-5
    description: Every ci.yml step, enumerated first and then reproduced locally.
    expected_status: "observed: lint rc=0; build rc=0; typecheck rc=0; generated
      JSON Schema diff 0 files; dependency-cruiser no violations; 929 tests
      passed"
goal_stopping_condition:
  - Stop when a lane whose evidence is currently gate-failing cannot be labelled
    done, and the diagnostic says which link failed and how it weakened. Do NOT
    extend this to proving the lane was ALWAYS passing -- promotion is a
    predicate over the state being promoted, and a digest created later proves
    nothing about earlier history. Historical integrity would need append-only
    transition receipts, which is a different piece of work and is not attempted
    here.
