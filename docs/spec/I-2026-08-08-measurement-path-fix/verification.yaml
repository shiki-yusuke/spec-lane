test_gaps:
  - taxonomy: manual-verification-required
    description: Rule 6's selector replay (emit-metrics passing group.selector's
      since/until/agents to telemetry.measure()) is proven at the core level
      (metrics-service.test.ts asserts the selector is carried into the group)
      and by direct code reading of emit-metrics.ts's measureOpts construction,
      but no CLI-level test captures the actual argv/options the fake agent-cost
      binary was invoked with to assert the exact Date values reached the
      adapter call. The existing fake-agent-cost test doubles
      (writeFakeAgentCost) ignore their invocation arguments entirely by design.
    location: packages/cli/src/commands/emit-metrics.ts
    priority: low
manual_verification:
  - id: real-agent-cost-selector-replay
    description: Run a real lane through calibrate --since/--until against real
      agent-cost, then emit-metrics, and confirm (e.g. via agent-cost's own
      verbose/debug output if available) that the re-query used the identical
      --since/--until/--agent values calibrate recorded, not a wider window.
    expected_status: pending
