premise_evidence:
  required: true
  method: code-only
  reproduced: true
  evidence: >-
    Read packages/core/src/gate.ts's DEFAULT_GATES registry (main @ 66d01f6) end to end:
    premiseEvidenceGate, successCriteriaGate, specConsensusGate, designEstablishmentGate,
    designDecisionGate, gateRulesetVersionGate, promotionWeakeningGate -- none spawns a
    subprocess or reads any project-external command configuration. Read runAdvance
    (packages/cli/src/commands/advance.ts) end to end: it calls evaluateGatesForTrigger for the
    phase_advance trigger and, only at 5_done, the promotion trigger; there is no other gate
    dispatch path and no dynamic plugin-loading mechanism anywhere in this call chain. Confirmed
    the 3_implement->4_verify edge's only currently-applicable gate is successCriteriaGate (its
    own appliesTo() condition), which never touches the filesystem outside spec/verification.yaml
    or spawns anything. Also read skills/lane/SKILL.md's own documented flow for that edge (Phase
    3 row): it ends in "Then `lane advance <intent-id> --phase 4_verify`" with no external-command
    step described anywhere before that. This is a static/code trace, not a live run against a
    real project's phase transition (upgrading to "live" would mean instrumenting a real lane and
    observing the transition succeed regardless of an external check's outcome; not done here).
