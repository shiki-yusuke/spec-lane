test_gaps:
  - taxonomy: context_variant_missed
    description: "Windows is untested and unsupported: shell:false spawnSync cannot
      launch .cmd/.bat directly. This is a pre-existing property of lane as a
      whole (wrapper-bind.ts has the same constraint) and was ruled out of scope
      at approval time (spec.md Q4/L6), not an oversight of this lane."
    priority: low
  - taxonomy: missing_state
    description: Grandchild processes are not tracked. SIGKILL reaches only the
      direct child spawnSync started; a child that forks and exits leaves its
      descendants running. Process-group kill needs an async spawn, which is
      incompatible with Gate.evaluate's synchronous contract (spec.md L9). No
      test asserts anything about grandchildren.
    priority: medium
  - taxonomy: missing_state
    description: The recursion guard is only tested for a cooperative child. A child
      that deliberately deletes LANE_EXTERNAL_VERIFY_ACTIVE before spawning a
      grandchild is not blocked, and there is no test for that path because it
      is explicitly not a supported boundary (spec.md L8).
    priority: low
  - taxonomy: wrong_assumption
    description: The digest binds argv strings, not what argv[0] points at. A
      swapped symlink or an edited script at the authorized absolute path is out
      of scope and untested (spec.md L1).
    priority: medium
manual_verification:
  - id: MV-1
    description: "Measured spawnSync's real timeout behaviour on this machine (Node
      v22.23.2) before relying on it: with the default killSignal, `timeout:
      300` against a child that ignores SIGTERM returned after 5033ms with
      status 0 / signal null / error ETIMEDOUT -- i.e. the deadline was not
      enforced and the result looks like success. With killSignal SIGKILL the
      same case returned in 303ms with status null / signal SIGKILL. Also
      measured ENOBUFS (signal SIGTERM), ENOENT, EACCES, and that an empty
      executable / a NUL in argv / a negative or NaN timeout all throw
      synchronously (ERR_INVALID_ARG_VALUE / ERR_OUT_OF_RANGE). The whole D7
      ordering and the SIGKILL requirement come from these measurements, not
      from reading the docs."
    expected_status: 実施済み 2026-08-29
  - id: MV-2
    description: Ran `lane start` from the built CLI in a throwaway repo and
      confirmed the scaffolded intent.yaml renders the external_verify guide
      comment and still passes `lane validate` (guard against the
      malformed-comment failure this repo has shipped before). Also confirmed
      the profile_digest computed under the new schema equals d72951e0...c88ca,
      the value a real lane-state.json written by lane 0.7.0 already contains.
    expected_status: 実施済み 2026-08-29
goal_stopping_condition:
  - "pnpm typecheck / pnpm lint / pnpm depcheck clean, and pnpm test green at
    1180 tests (baseline before this lane: 1096)"
  - No behaviour change for any lane that does not configure external_verify,
    demonstrated by the profile_digest of the shipped profile still matching a
    pre-change recorded value
spec_consensus:
  spec_ssot_ref: docs/spec/I-2026-08-29-external-verify-gate/spec.md
  spec_digest: 2a92882cdd63c8e2a329b989a31fd6dd3cb5cf963ef4734b5e4f9c836d6d1c28
  verification_digest: 29f86cf75cf5283ad690454a2f1a6effa091acf4be44ed5cbc20920455f69ca0
  deviations:
    - spec_ref: "D1 (rev2): digest binds {argv, timeout_seconds}"
      actual: "Implemented as {argv, timeout_seconds, cwd}. The approved rev2 wording
        bound only argv+timeout, which binds a string rather than a file: only
        argv[0] must be absolute, so a later relative argument resolves against
        the child's cwd, and an authorization held in a profile outside the
        checkout (the arrangement L3 recommended) matched in any repository
        declaring the same strings and ran that repository's own script.
        Reproduced live against two checkouts before the change and confirmed
        refused after it."
      action: update_spec
      status: resolved
      rationale: "spec.md updated to rev3: D1 now specifies the cwd-bearing digest, L1
        rewritten to say what is and is not pinned, L10 added for the
        /usr/bin/env case, and section 10 records the finding with its
        reproduction. Tests TEST-44/TEST-45 added. The approved intent's success
        criteria are unaffected -- success[2] asks that the executed command be
        exactly the authorized one, which this strengthens rather than changes."
  reviewer_ack:
    reviewer_kind: self
    reviewer_id: shiki-yusuke-orchestrator
    acked_at: 2026-08-29T13:39:14.633Z
