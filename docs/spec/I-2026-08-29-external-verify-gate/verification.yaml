success_criteria_matrix:
  - criterion: An intent with no external verify command configured behaves
      identically to today (zero diagnostics, zero subprocess calls, no new
      required fields) -- this feature is opt-in only.
    covered_by: test
    evidence: "packages/cli/test/external-verify.test.ts TEST-01/TEST-23 (a
      `neverRuns` runner that throws if invoked, plus no snapshot written);
      packages/core/test/external-verify.test.ts 'skips entirely when the lane
      configured nothing';
      packages/core/test/external-verify-profile-compat.test.ts TEST-32/TEST-33
      (shipped profile unchanged, and its parsed digest still equals the value
      lane 0.7.0 recorded before this field existed). No new field is required:
      all three schema additions are .optional() with no .default()."
    negation_test: packages/core/test/external-verify-profile-compat.test.ts 'a
      profile that DOES configure external_verify gets a different digest (the
      assertion above is not vacuous)' -- proves the equality assertion would
      actually notice a change. The `neverRuns` runner throws rather than
      returning, so a spurious invocation fails the test rather than passing
      silently.
  - criterion: An intent with an external verify command configured has that command
      actually invoked at the 3_implement->4_verify phase_advance edge, and lane
      advance refuses the transition (writes nothing to lane-state.json)
      whenever the command exits non-zero, times out, or fails to spawn at all.
    covered_by: test
    evidence: "packages/cli/test/external-verify.test.ts spawns real child
      processes: TEST-04 (exit 0 -> transition succeeds), TEST-05 (exit 3 ->
      refused and lane-state.json byte-identical), TEST-06/TEST-20
      (SIGTERM-ignoring child -> timeout, elapsed bounded), TEST-07 (missing
      executable -> spawn_failed/ENOENT), TEST-19 (signal death), TEST-28
      (maxBuffer overflow)."
    negation_test: "TEST-04 is the negation of the refusal cases: the same wiring
      lets an exit-0 command through, so the refusals are not an unconditional
      block. TEST-05 asserts byte-for-byte equality of lane-state.json, so a
      partial write would fail rather than go unnoticed."
  - criterion: The command that runs is always exactly the argv recorded at the
      point the operator's configuration was accepted -- never a string built at
      run time from a separately-mutable file, and never passed through a shell
      (so no argument can be reinterpreted as shell syntax).
    covered_by: test
    evidence: "Authorization is a digest over {argv, timeout_seconds, cwd}
      (core/external-verify.ts computeExternalVerifyDigest), checked against
      allowed_command_digests read from ~/.config/lane/external-verify.yaml --
      never the profile -- so the executed argv is exactly the authorized one:
      packages/core/test/external-verify.test.ts TEST-09 (one differing argument
      refused), 'refuses when only the timeout differs', TEST-35 (authorized
      interpreter + new args refused). argv[0] must be absolute
      (packages/schemas/test/intent.test.ts TEST-36), removing $PATH from the
      decision. spawnSync is called with shell:false and argv as an array
      (packages/cli/src/external-verify-runner.ts)."
    negation_test: packages/cli/test/external-verify.test.ts TEST-10 passes `; touch
      <canary>` as an argument and asserts the canary file is never created --
      if anything ever routed argv through a shell, that file would appear and
      the test would fail.
  - criterion: The gate's own diagnostics never assume or depend on any particular
      external tool's CLI syntax or output format (only the child process's exit
      status/timeout/spawn-failure is read) -- deterministic-discipline's dd
      verify --session is the motivating example, not a hardcoded dependency.
    covered_by: test
    evidence: classifyExternalVerifyResult's parameter type is {status, signal,
      error} only -- the child's output is not an input to the verdict by
      construction (packages/core/src/external-verify.ts). Output is captured
      solely to attach a bounded tail to a failure diagnostic. `grep -rniE
      'deterministic-discipline|dd verify'` over the three new/changed source
      files returns nothing.
    negation_test: "packages/cli/test/external-verify.test.ts TEST-43: a command
      printing 'FAIL: 3 checks failed' but exiting 0 must still pass, and one
      printing 'PASS: all good' but exiting 1 must still fail. Either half
      breaks the moment anything starts reading stdout for the verdict."
cross_check_intent_vs_spec:
  performed_at: 2026-08-29 (Phase 3)
  finding: "Direction 2 performed. spec.md rev2 does impose conditions stronger
    than intent.yaml's success lines state, but they are constraints (already in
    intent.constraints/critical_invariants) or honest limitations rather than
    new acceptance criteria, so intent.yaml was left as the weaker-but-accurate
    SSOT rather than being rewritten: (a) authorization is by whole-command
    digest, which is a stronger mechanism than success[2]'s 'exactly the argv
    recorded' but not a different claim; (b) D6's killSignal SIGKILL requirement
    and D7's ordering are implementation obligations discovered by measurement,
    covered by success[1]'s 'times out'; (c) D9's snapshot recording and D8's
    recursion guard were added by user decision (Q1) and architect review after
    the success lines were approved -- they are recorded as EARS-04/14/15 with
    their own TEST-IDs, and are additive capabilities rather than conditions the
    original four lines fail to express. One genuine scope correction was made
    instead of a silent expansion: README.md was named in the approved
    cross-check table's DEP-08 but was missing from
    ai_inferred_scope.allowed_paths, and has been added with an inline note."
