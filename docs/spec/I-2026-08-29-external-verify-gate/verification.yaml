test_gaps:
  - taxonomy: context_variant_missed
    description: "Windows is untested and unsupported: shell:false spawnSync cannot
      launch .cmd/.bat directly. This is a pre-existing property of lane as a
      whole (wrapper-bind.ts has the same constraint) and was ruled out of scope
      at approval time (spec.md Q4/L6), not an oversight of this lane."
    priority: low
  - taxonomy: missing_state
    description: Grandchild processes are not tracked. SIGKILL reaches only the
      direct child spawnSync started; a child that forks and exits leaves its
      descendants running. Process-group kill needs an async spawn, which is
      incompatible with Gate.evaluate's synchronous contract (spec.md L9). No
      test asserts anything about grandchildren.
    priority: medium
  - taxonomy: missing_state
    description: The recursion guard is only tested for a cooperative child. A child
      that deliberately deletes LANE_EXTERNAL_VERIFY_ACTIVE before spawning a
      grandchild is not blocked, and there is no test for that path because it
      is explicitly not a supported boundary (spec.md L8).
    priority: low
  - taxonomy: wrong_assumption
    description: The digest binds argv strings, not what argv[0] points at. A
      swapped symlink or an edited script at the authorized absolute path is out
      of scope and untested (spec.md L1).
    priority: medium
manual_verification:
  - id: MV-1
    description: "Measured spawnSync's real timeout behaviour on this machine (Node
      v22.23.2) before relying on it: with the default killSignal, `timeout:
      300` against a child that ignores SIGTERM returned after 5033ms with
      status 0 / signal null / error ETIMEDOUT -- i.e. the deadline was not
      enforced and the result looks like success. With killSignal SIGKILL the
      same case returned in 303ms with status null / signal SIGKILL. Also
      measured ENOBUFS (signal SIGTERM), ENOENT, EACCES, and that an empty
      executable / a NUL in argv / a negative or NaN timeout all throw
      synchronously (ERR_INVALID_ARG_VALUE / ERR_OUT_OF_RANGE). The whole D7
      ordering and the SIGKILL requirement come from these measurements, not
      from reading the docs."
    expected_status: 実施済み 2026-08-29
  - id: MV-2
    description: Ran `lane start` from the built CLI in a throwaway repo and
      confirmed the scaffolded intent.yaml renders the external_verify guide
      comment and still passes `lane validate` (guard against the
      malformed-comment failure this repo has shipped before). Also confirmed
      the profile_digest computed under the new schema equals d72951e0...c88ca,
      the value a real lane-state.json written by lane 0.7.0 already contains.
    expected_status: 実施済み 2026-08-29
goal_stopping_condition:
  - "All six gates the CI workflow actually runs are green locally, not a weaker
    local subset: pnpm run lint / pnpm run build / pnpm -r run typecheck / the
    generate:json-schema no-diff check / dependency-cruiser / pnpm -r run test
    at 1219 tests (baseline before this lane: 1096) -- the count verified at the
    current revision. NOT merged: the PR is open and the required architect
    review has not run. An earlier revision of this line said 1189 and stayed
    there while the suite grew across review rounds; correcting that, I
    described the revision as reviewed and merged, which was not true of any
    revision. Both the staleness and that overstatement are recorded rather than
    quietly replaced, because this line is an audit record and a silent fix
    would be the same defect again. `pnpm -r run typecheck` is named
    deliberately: the root `pnpm typecheck` is `tsc -b`, which builds via
    tsconfig.build.json and therefore does NOT typecheck test files. Relying on
    it let a real type error in this lane's own test helper reach CI, where it
    was caught and then fixed."
  - No behaviour change for any lane that does not configure external_verify,
    demonstrated by the profile_digest of the shipped profile still matching a
    pre-change recorded value
spec_consensus:
  spec_ssot_ref: docs/spec/I-2026-08-29-external-verify-gate/spec.md
  spec_digest: 3943ba6c4176bb81ca05794b0f993be9dfe6967bfc99903fcd11f0cbef81d465
  verification_digest: 3b86e81314ee329727c4c471170d5a8a0ca5e303eb6fe5a75f307feb3a6caf6b
  deviations:
    - spec_ref: "D1 (rev2): digest binds {argv, timeout_seconds}"
      actual: "Implemented as {argv, timeout_seconds, cwd}. The approved rev2 wording
        bound only argv+timeout, which binds a string rather than a file: only
        argv[0] must be absolute, so a later relative argument resolves against
        the child's cwd, and an authorization held in a profile outside the
        checkout (the arrangement L3 recommended) matched in any repository
        declaring the same strings and ran that repository's own script.
        Reproduced live against two checkouts before the change and confirmed
        refused after it."
      action: update_spec
      status: resolved
      rationale: "spec.md updated to rev3: D1 now specifies the cwd-bearing digest, L1
        rewritten to say what is and is not pinned, L10 added for the
        /usr/bin/env case, and section 10 records the finding with its
        reproduction. Tests TEST-44/TEST-45 added. The approved intent's success
        criteria are unaffected -- success[2] asks that the executed command be
        exactly the authorized one, which this strengthens rather than changes."
    - spec_ref: "L3 (rev3): default profile resolves from outside the checkout"
      actual: False. packageDefaultProfilePath() resolves to
        packages/cli/resources/profiles/generic.profile.yaml, a tracked file in
        lane's own repository, so running from source put both keys inside the
        branch. Reproduced end to end with no --profile and no
        LANE_PROFILE_PATH. Authorization is now restricted to the flag/env tiers
        and refuses anything else.
      action: update_spec
      status: resolved
      rationale: spec.md L3 rewritten (rev4) to state the enforced rule instead of the
        false claim; section 11 records the finding, the fact that the first fix
        missed because it compared against the wrong directory, and the
        reproduction. README and skills/lane/SKILL.md corrected. TEST-49/TEST-50
        added.
    - spec_ref: "D1 (rev3/rev4): authorization lives in the profile"
      actual: Authorization moved out of the profile entirely, into
        ~/.config/lane/external-verify.yaml resolved from homedir() only. Four
        successive path-based designs were each reproducibly defeated; the
        fourth (my own, using resolveConfigDir) was broken by pointing
        LANE_CONFIG_DIR at the attacker's checkout, which I found by testing my
        own fix before claiming it worked. No 'outside X' rule can hold, because
        the attacker can place a file anywhere writable.
      action: update_spec
      status: resolved
      rationale: spec.md section 12 records all four attempts and why path-based rules
        cannot work; README and SKILL.md rewritten. Correction -- this rationale
        originally also claimed L3 and D1 had been updated. They had not; both
        were left describing the abandoned profile-based design until a
        documentation audit caught it. They are updated now, and the discrepancy
        is recorded here rather than quietly overwritten. The store is refused
        if a profile still carries the old field (authorization_in_profile) so
        the change cannot fail silently. Verified against all three reproduction
        scripts.
    - spec_ref: "D1 (rev5): authorization_store_inside_workspace refuses a store that
        overlaps the gated tree"
      actual: "Broken two ways in adversarial review, both reaching arbitrary command
        execution, both reproduced independently afterwards. (1) The check
        measured cwd and specDir, not the repository: launching lane from a
        SUBDIRECTORY dropped the rest of the repo out of scope, so a store
        inside the repo passed -- environment identical, only `cd` differed. (2)
        realpathSync does not resolve hard links, so a store hard-linked to a
        file inside the repo resolves to its home-side path and passes, from the
        repo root, with no subdirectory needed."
      action: update_spec
      status: resolved
      rationale: "This is the same error as rounds 1-4 in a new place: the fact being
        measured (is the store under the launch directory) is not the fact that
        matters (is the store writable from inside the gated tree). Fixed by
        widening each workspace to its git worktree root, and by adding a
        separate refusal on st_nlink > 1. Note this reopened a judgment recorded
        in section 12 -- ownership/mode checks were rejected there, and that
        rejection was applied too broadly to link inspection. nlink is not a
        permission bit; it answers exactly the question realpath cannot. spec.md
        section 13 records both, L12 is split into permissions (still not
        checked) and linkage (checked), and L13 states that git worktree root is
        an approximation which misses a store materialized in a submodule or a
        separate checkout. TEST-54/TEST-55 added, each verified to fail with its
        own fix removed."
    - spec_ref: "verification.yaml (earlier revision): TEST-51 pins that an
        unconfigured lane never reads the authorization store"
      actual: TEST-51 cannot show that. Production reads `options.store ??
        readExternalVerifyStore()`, so injecting a store makes the real function
        unreachable; what the test actually pins is that the injected object's
        getters are untouched. Moving the early return below the store read --
        the exact drift the fix commit warns about -- leaves the whole suite
        green. Confirmed by mutation.
      action: update_spec
      status: resolved
      rationale: "Recorded rather than quietly relabelled, because the claim was
        load-bearing: it was cited as the evidence that the opt-in invariant
        held. TEST-53 added, driving the real read path through a swapped $HOME
        with a malformed store on disk, and verified to fail under that
        mutation. TEST-51 is kept for what it does pin (the injected seam) with
        its limits stated. Same round also found the trigger half of the adapter
        guard untested (TEST-56, counting store reads) and the `lane start`
        scaffold still telling operators to authorize in the profile -- the one
        action the gate hard-refuses."
    - spec_ref: "spec.md section 13: authorization_store_multiply_linked (st_nlink >
        1) closes the hard-link bypass; git worktree root closes the
        subdirectory bypass"
      actual: "Both defeated in the next review round, both reproduced independently.
        The nlink check is bypassed by link -> write -> unlink: the second name
        exists only during the write, st_nlink returns to 1, and the injected
        digest stays. Three commands, no race needed. The git-worktree widening
        is bypassed by planting a nested repository: the adversary writes the
        worktree, so `git init` in a subdirectory (or a `.git` file pointing
        elsewhere) makes --show-toplevel return that subdirectory and shrinks
        the workspace right back. The nlink check was also a denial of service
        -- hard-linking the operator's store from the worktree blocks every
        lane's 3->4 transition, with no home-directory access at all."
      action: update_spec
      status: resolved
      rationale: "The nlink check is REMOVED. It answers \"is there another name now\"
        when the fact needed is \"was this ever written from inside the tree\",
        and it cost availability while catching nothing. That reverses a
        reversal made one round earlier: section 12 rejected file-metadata
        checks, section 13 overturned that as \"applied too broadly to
        linkage\", and section 14 restores it. Section 12 was right; only its
        reasoning was underspecified. The overlap check is KEPT with its claim
        withdrawn -- documented as detecting an operator's misconfiguration, not
        as a barrier. The fact it wants is undecidable: lane and the adversary
        share a UID, enumerating every name for an inode needs a
        whole-filesystem scan, and no record of past writes exists. Section 12
        concluded that no \"outside X\" rule can hold, then exempted this one as
        \"a question of fact rather than derived trust\". That exemption was
        wrong and cost two further rounds. spec.md L14 now states what the
        feature actually rests on -- the adversary's writes being confined to
        the worktree, a property of the agent's sandbox that lane does not
        verify."
    - spec_ref: "spec.md L14 (previous revision): what protects the store is that the
        adversary's writes are confined to the worktree"
      actual: "Too weak, and it contradicts this same document's own hard-link
        finding. Under a path-prefix write filter, link(store, worktree/x)
        creates a name inside the worktree and writing through that name targets
        a path inside the worktree -- both permitted -- and the store's bytes
        change. The stated condition holds while the store is written. Also, the
        commit that demoted this check to detection-only deleted L13's caveat
        that detection misses a store overlapping an OUTER repository when lane
        runs from inside a submodule. Reproduced: workspaces shrinks to the
        submodule and the overlap goes unreported, with no adversary involved."
      action: update_spec
      status: resolved
      rationale: "L14 now names the property actually required -- no path the
        adversary can create resolves to the store's inode, which is
        mount/filesystem-view scoping, not path scoping -- and says plainly that
        a path-prefix sandbox leaves this gate's authorization unprotected.
        L13's caveat is restored, and is more important now than before: a check
        that only detects must be explicit about what it fails to detect. Same
        round confirmed the O_NOFOLLOW / directory-permission approach was
        correctly abandoned: O_NOFOLLOW inspects only the final component, so it
        is blind to both the stow indirection (a parent component) and hard
        links, and the directory-permission check is ssh StrictModes, which is
        meaningless when the adversary shares the UID. st_dev is the one
        decidable fact in the area (a cross-filesystem store cannot be
        hard-linked at all) and it does not generalize, since $HOME and the
        repository are normally the same volume."
    - spec_ref: "verification.yaml (earlier revision): EARS-12 covered by TEST-37;
        spec.md sections 2/5/6: authorization lives in the profile"
      actual: Found by an automated PR review, and all of it correct. TEST-37 proves
        schema-invalid input is rejected before the runner runs, which is not
        the EARS-12 claim; nothing exercised a throwing runner, and the adapter
        called runner.run() bare, so an exception escaped gate evaluation
        entirely instead of refusing. The glossary, EARS-02 and two Gherkin
        scenarios still defined authorization as membership in the profile --
        the one configuration the implementation hard-refuses -- so the SSOT
        specified behaviour that cannot succeed. Four code comments said the
        same. The store schema stripped unknown keys, so a misspelled
        allowed_command_digest became an empty allow-list reported as
        `unauthorized`, hiding the typo behind the wrong diagnosis in the module
        whose stated purpose is not to. The "cannot resolve the store => refuse"
        branch was unreachable, because the adapter's realpath helper returns
        the unresolved string on failure. The outcome union carried a `skipped`
        variant that nothing produced and the gate treated as success. The
        snapshot's exit_status accepted any integer though it is only ever
        written for exit 0.
      action: update_spec
      status: resolved
      rationale: "All fixed. TEST-40/57/58/59 added, each verified to fail with its
        own change reverted; the adapter converts a runner throw into
        invalid_configuration; the store schema is strict; an
        existing-but-unresolvable store refuses while an ABSENT one still
        reports unauthorized (the two were conflated, and refusing on absence
        would have replaced the one message that tells an operator what to do);
        `skipped` is removed from the union and the gate branch; exit_status is
        z.literal(0) with the passed outcome typed to match. The normative
        sections and comments now name the authorization store. Worth recording
        separately: fixing the realpath branch surfaced that eight subprocess
        tests were passing against a fixture store path nobody had created,
        which the new behaviour correctly refused. The fixture now writes a real
        file, which is what it was always standing in for."
    - spec_ref: the same commit that ruled 'crashing before deciding is not
        fail-closed' and wrapped runner.run in try/catch
      actual: "That commit also made the store schema strict, and the throw it
        introduced had no handler anywhere on the call path: a one-character
        typo in the store key flew past the gate, past advance, and out of main
        as a raw ZodError issues array with exit 2. The principle was stated and
        violated in the same change. TEST-57 pinned only that the store function
        throws -- not what that throw becomes in a real `lane advance`, which is
        the part that matters. Separately, an unresolvable store path was
        refused under the SAME code as an overlap, so an operator with a
        dangling symlink was told their dotfiles setup overlaps the gated
        repository and to move a store that is not misplaced -- and TEST-58
        asserted exactly that misdiagnosis."
      action: update_spec
      status: resolved
      rationale: Store read/parse failure now converts to an
        `authorization_store_unreadable` refusal whose diagnostic names the only
        recognized key, and TEST-60 drives the real read path through a swapped
        $HOME so the principle and the code cannot drift apart again.
        `authorization_store_unresolvable` is split out from the overlap code
        with its own message saying moving the store will not help; TEST-58's
        expectation is corrected. Both verified to fail with their own change
        reverted. Recorded rather than folded into the previous entry because
        the failure mode is the one this feature keeps repeating -- a diagnosis
        that sends the operator to the wrong file -- committed here by the
        change that was fixing that very class of error.
    - spec_ref: spec.md D7 failure table (still listing the profile allowlist);
        EARS-16 (output truncated to 2000 characters); external-verify-store.ts
        read handling
      actual: Three findings from a second automated pass, all new. The blanket catch
        around readFileSync treated EACCES, EISDIR and every other read failure
        as "no store", so a present, valid, unreadable store was reported as
        `unauthorized` -- telling the operator to add a digest that may already
        be in the file. Reproduced. That branch was introduced by the previous
        round's own `exists` change and looked like it was only handling "not
        configured yet". The D7 failure table still described profile
        authorization, having been missed when sections 2, 5 and 6 were
        corrected. And truncateExternalVerifyOutput returned 2015 characters for
        a stated bound of 2000, because the marker was prepended after slicing
        to the limit rather than counted against it.
      action: update_spec
      status: resolved
      rationale: Only ENOENT now means absent; anything else re-throws and surfaces as
        authorization_store_unreadable, whose diagnostic was also reworded (it
        said "could not be parsed", which is wrong for a read failure). D7 lists
        the current seven refusal codes. The truncation marker is counted inside
        the budget. Recorded with a note that this is the third time a commit
        fixing stale normative text left other stale normative text in the same
        document -- section 13 to 14 dropped an L13 caveat, section 15 fixed
        sections 2/5/6 and missed D7. Cleaning normative prose by reading
        through it does not converge; it needs to be grep-driven.
    - spec_ref: spec.md TEST-14 (estimate --adopt round-trip); SKILL.md 'untruncated'
        output tail and 'lane-state.json untouched'; ENOENT as proof the store
        is absent
      actual: "Four more findings, all new. ENOENT does not prove absence:
        readFileSync returns it for a DANGLING SYMLINK too, so a broken store
        link was reported as \"no store\" and surfaced as `unauthorized` -- and
        the authorization_store_unresolvable path added for exactly this case
        was unreachable in production. TEST-58 could not catch it, because it
        injects `exists: true`, which is the decision under test. spec.md's
        matrix named TEST-14 for the estimate --adopt round-trip and nothing
        implemented it; there was no verification row either, so a reserializer
        dropping external_verify would silently un-gate a lane. SKILL.md called
        the attached output \"untruncated\" when it is truncated to 20 lines /
        2000 characters, and stated that failures leave lane-state.json
        untouched, which is true of advance but not of validate (it appends an
        effective_risk_log entry on every call, before any gate runs)."
      action: update_spec
      status: resolved
      rationale: lstat now separates a dangling link from a missing pathname, with
        TEST-63 driving the real read path through a swapped $HOME rather than
        injecting the answer. TEST-14 is implemented and given a row here,
        asserted against the raw YAML as well as the reader. SKILL.md and README
        now say truncated, and qualify the untouched-state guarantee as
        advance's rather than validate's. Two of these are tests that asserted
        the right thing about the wrong layer -- TEST-58 injecting the decision
        it was meant to verify, and a named-but-absent TEST-14 that made the
        matrix look complete. That is the same shape as the TEST-51 and TEST-37
        findings recorded above, now three times over.
    - spec_ref: spec.md D2 (the subprocess runs inside buildGateContext); section 17-1
        (lstat separates a dangling store link from an absent one)
      actual: "Three more findings. A FIFO at the store path made readFileSync wait
        forever, and nothing bounds that wait -- the verify command's timeout
        cannot help because the child has not been started, so `lane advance`
        simply hangs. Measured: still blocked when an external 4s kill ended it.
        The lstat fix only covers a dangling FINAL component; if ~/.config
        itself is the broken link -- the component dotfiles managers actually
        symlink, so the likelier shape -- readFileSync and lstat both report
        ENOENT and it is indistinguishable from \"no store\". And
        buildGateContext read verification.yaml, critic.yaml, spec.md and the
        design artifacts BEFORE running the command, so a verifier that
        regenerates any of them left the remaining gates evaluating, and the
        transition being snapshotted from, content that no longer existed --
        with spec_consensus binding a reviewer ack to digests of exactly those
        files."
      action: update_spec
      status: resolved
      rationale: "statSync (which follows links but opens nothing) now rejects a
        non-regular file before the read; the path is walked upward to find a
        dangling ancestor link; and resolveExternalVerify moved to the top of
        buildGateContext so every artifact is read as the command left it.
        TEST-64/65/66 added, each verified to fail with its own fix reverted --
        TEST-64 by hanging the suite rather than failing it, which is the
        defect's own signature and makes that test a liveness assertion.
        Recorded limitation: intent and profile are read by buildGateContext's
        CALLER and are outside this reorder. That is not an authorization hole
        -- a verifier rewriting its own external_verify still gets this
        transition snapshotted with the digest that actually ran, and the next
        transition recomputes from the new declaration and needs fresh
        authorization -- but the staleness is real and is stated in section 18."
    - spec_ref: spec.md section 15-3 (removing the `skipped` variant closes that
        fail-open); critic.yaml required_actions (implement
        profile.external_verify.allowed_executables)
      actual: "Removing `skipped` did not close the fail-open. The gate treated an
        ABSENT artifact as success without consulting the intent, so a lane that
        declares external_verify but whose context carries no result passed the
        3->4 edge with nothing verified. Reproduced against the gate directly: a
        configured intent with no artifact returned zero diagnostics. What was
        removed was a spurious value; the same hole remained in the shape of a
        missing answer. Separately, critic.yaml still lists as a Phase 3
        obligation the abandoned profile.external_verify.allowed_executables,
        and instructs maintainers to add that key to the bundled profile --
        which would make every lane fail with authorization_in_profile, and
        would break the profile_digest compatibility invariant."
      action: update_spec
      status: resolved
      rationale: "The gate now distinguishes the two absences by asking the intent,
        which is the only artifact that can tell them apart: an unconfigured
        lane still contributes nothing (TEST-68), a configured one with no
        result is refused as `missing_result` (TEST-67). critic.yaml's entries
        are marked SUPERSEDED/AMENDED with what replaced them, rather than
        deleted, since they record what was believed at design time. Recorded as
        the fourth instance of stale normative text surviving a cleanup pass,
        and the first in critic.yaml. Section 16 concluded this work has to be
        grep-driven; that grep had only ever been run against spec.md. A lane
        has four artifacts -- intent, spec, critic, verification -- and all four
        have to be searched."
    - spec_ref: spec.md D7 (refusal order); section 17-4 (the untouched-state claim);
        goal_stopping_condition test count
      actual: "Four findings, all in code untouched since the previous review. The
        adapter refused at the point it read the store, which jumped ahead of
        the order D7 specifies: an unreadable store masked
        authorization_in_profile, so a typo in one file suppressed the diagnosis
        naming a DIFFERENT file to fix. A symlink loop (statSync throws ELOOP)
        was rethrown into the unreadable branch, telling the operator to check
        for a misspelled key in a file that cannot be opened. The shared refusal
        diagnostic still claimed lane-state.json is unchanged, which section
        17-4 had already corrected in the README and SKILL.md but not in the
        message itself. And the stopping condition still said 1189 tests while
        the suite had grown to 1205 across review rounds."
      action: update_spec
      status: resolved
      rationale: The store failure is now passed into planExternalVerify instead of
        refused at the read, so refusal order lives in one place -- the same
        lesson as section 15-9, where the adapter let an exception escape past
        the gate; this time it was intercepting rather than escaping, with the
        same effect of bypassing the ordered decision. ELOOP maps to
        authorization_store_unresolvable. The diagnostic now says no phase
        change or gate snapshot is recorded, which is true of both advance and
        validate. The count is 1205, with a note that it had gone stale. Fifth
        instance of stale text surviving a cleanup. Section 19 concluded the
        grep must cover all four lane artifacts; it did, and this one was a
        string literal in packages/core/src. The search has to include source
        strings, not only artifacts.
    - spec_ref: "spec.md section 18: the stale-intent limitation is not an
        authorization hole, because the next transition recomputes the digest
        and requires fresh authorization"
      actual: There is no such transition. The gate fires only on 3_implement ->
        4_verify (isExternalVerifyTrigger), and L2 states it is deliberately not
        re-checked at 5_done -- so a verifier that swaps intent.yaml's
        external_verify after the authorized command passed leaves the new
        command never checked at all, while gate_snapshots.external_verify
        vouches for the one that ran. Other gates on the same transition are
        likewise decided against a pre-command intent, including intent.success
        feeding success_criteria. The refuting evidence was L2, in the same
        document as the claim. A root-level zero-byte file from a mistyped shell
        redirect had also been committed, and a doc comment said three
        authorization designs where the same comment and the README both count
        four.
      action: update_spec
      status: resolved
      rationale: "The intent is digested before the command runs and compared
        afterwards; any change refuses with intent_modified_during_verification,
        whatever the command's own outcome. The comparison covers the WHOLE
        intent rather than just external_verify: authorization is the case that
        must close, but deciding a transition against a moving target is not
        something to permit selectively, and re-running once the file settles is
        cheap because the command is already authorized. The stray file is
        deleted and the count corrected. The section 18 claim is left in place
        with a correction notice pointing here, rather than rewritten -- I had
        invited exactly this refutation in review, and the record of having been
        wrong is worth more than a clean paragraph."
    - spec_ref: spec.md section 23 (D7 coverage is enforced by test); D6 (SIGKILL
        bounds the wait); D7 unauthorized row (an absent store reports
        unauthorized)
      actual: "The D7 coverage test added one commit earlier had a hole: it walked the
        two outcome unions, and `missing_result` -- emitted directly by the
        gate, and the only code standing between a configured lane and an
        unverified transition -- belongs to neither, so it was absent from D7
        while both assertions stayed green. SIGKILL bounds only the direct
        child: with stdout/stderr captured through pipes, a grandchild that
        inherited them keeps spawnSync waiting (measured: 3112ms for a child
        that exited 0 at once). The overlap branch also runs for an ABSENT
        store, so a $HOME inside the gated repository produced
        authorization_store_inside_workspace where D7 and TEST-59 promise
        unauthorized. And the profile has the same stale window as the intent,
        including a profile that gains the legacy external_verify key
        mid-verification."
      action: update_spec
      status: resolved
      rationale: "A third exported list (EXTERNAL_VERIFY_GATE_ONLY_CODES) closes the
        coverage hole, and D7 documents missing_result.
        profile_modified_during_verification mirrors the intent check, with the
        profile path passed in for that comparison only and never for
        authorization. The absent-store finding was resolved the other way: the
        behaviour is correct and the contract was wrong, because an unauthorized
        message would send an operator to create a store at a path the next run
        refuses -- writing that test then exposed a real bug, an absent store's
        path being compared without realpath normalisation, which /var ->
        /private/var defeated. On SIGKILL, the review's claim that the CLI
        timeout can itself hang did not reproduce: three measurements all
        returned within the deadline. The mechanism is real but the consequence
        is different, and D6 now states it -- elapsed time is bounded by the
        deadline and, inside it, governed by descendants rather than by the
        child, so a command that exited 0 immediately can be classified as
        `timeout`. Also recorded: cleaning up after this round's mutation
        testing, `git checkout` reverted spec.md edits made in the same session,
        and the section 23 coverage test caught it immediately. First evidence
        that replacing the promise with a test was the right call."
