success_criteria_matrix:
  - criterion: The checkout ignores the dd ledger directory (`.dd/`) via the tracked
      `.gitignore`, so `git status --porcelain --untracked-files=all` never
      lists `.dd/ledger.jsonl` or `.dd/current-run.json` (dd gate's scope-edit
      detector treats untracked, non-ignored paths as candidate violations).
    covered_by: manual
    evidence: MV-01; diff adds exactly `.dd/` plus a comment line
    negation_test: "MV-01 before-state: with the rule absent, git status listed
      .dd/current-run.json and .dd/ledger.jsonl as untracked (observed
      2026-09-02 before the edit)"
  - criterion: This lane's own 3_implement->4_verify transition is decided by a real
      `dd gate` run spawned by lane's external_verify runner from this checkout,
      under the operator's real `~/.config/lane/external-verify.yaml`, and
      `lane-state.json` records the command digest in
      `gate_snapshots.external_verify`.
    covered_by: manual
    evidence: MV-02; lane-state.json after advance
    negation_test: "MV-02 before authorization: refused without running; after
      authorization but before dd run open: dd gate exit 1 refused the
      transition (no state written)"
  - criterion: The dd hooks (SessionStart / PreToolUse) actually fired in the Claude
      Code session that made the change -- observable as session_start /
      observation rows for this intent id in `.dd/ledger.jsonl`, not inferred
      from configuration.
    covered_by: manual
    evidence: MV-03
    negation_test: The dd repo's own shadow-pilot ledger is a different file (.dd/
      in that repo); this checkout's ledger did not exist before dd run open
      here, so the rows cannot come from another session
