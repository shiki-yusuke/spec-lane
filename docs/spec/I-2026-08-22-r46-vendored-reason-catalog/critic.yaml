  - lens_id: error_handling
    result: applicable
    taxonomy: missing_state
    finding: >-
      mapReasonRecordToDesignMessage の involvement_dimension / no_shared_lineage_possible の
      3箇所で `record.params.X ?? "unrecorded"` という**フォールバック**を書いた
      (priorInvolvement / shaperKind / criticKind)。この関数の他の全パスは「未知の code は
      throw する」という fail-closed 規約なのに、この3箇所だけは「値が null/undefined なら
      黙って文字列 'unrecorded' を埋める」という別の規約になっている。
      実際には @lane/schemas 側のスキーマ（PriorInvolvementSchema は必須、EngineRef.kind も
      "model"|"human" 必須）がこれらの値を常に埋めることを保証しているので、スキーマを通った
      本物のドキュメントに対しては到達しない防御的コードのはずだが、それを保証しているのは
      コメントであって型でもテストでもない。将来スキーマ側の制約が緩んだ場合、この関数だけが
      無言でフォールバックし、同じ関数の他のコードパスが持つ fail-closed の原則から外れる。
    evidence: >-
      packages/core/src/design-independence.ts の mapReasonRecordToDesignMessage 内、
      involvement_dimension / no_shared_lineage_possible の各 case 実装。vendor 側の
      derive-independence.d.mts が EngineRefLike.kind を optional、prior_involvement を
      string | null | undefined として許容する緩い型を宣言しているため、この関数の型シグネチャ上は
      null/undefined が来ないことを表明できない。
    knowledge_candidates: []
    knowledge_refs: []

