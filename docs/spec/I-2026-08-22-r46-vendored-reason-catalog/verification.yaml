test_gaps:
  - taxonomy: missing_state
    description: "mapReasonRecordToDesignMessage's involvement_dimension and
      no_shared_lineage_possible cases fall back to the literal string
      \"unrecorded\" when the vendored record's params.prior_involvement /
      params.shaper_kind / params.critic_kind is null or undefined -- a
      different (silent-default) convention from every other case in the same
      function, which throws on anything unexpected. In practice this is
      unreachable for any document that passed @lane/schemas validation
      (PriorInvolvementSchema and EngineRef.kind are both required, non-optional
      fields), so the fallback exists only because the vendored module's own
      .d.mts types these fields more loosely than lane's schemas do (R37:
      consumed as-is). No test exercises the fallback branch itself, and no type
      distinguishes \"came from a schema-valid document\" from \"vendored
      signature technically allows null\" at this function's boundary."
    location: packages/core/src/design-independence.ts
      (mapReasonRecordToDesignMessage, involvement_dimension /
      no_shared_lineage_possible cases)
    priority: low
  - taxonomy: test_missing
    description: "Two of the 20 vendored REASON_CODES --
      human_missing_decision_maker_flag (a human critic with is_decision_maker
      unset) and no_shared_lineage_possible (an artifact_shaper of kind=human
      compared against a model critic) -- are exercised only via the synthetic
      sample records in design-independence-reason-catalog.test.ts, not via any
      real design-options/v1 document end-to-end through evaluateReview(). No
      fixture under packages/schemas/test/fixtures/design-options/v1/fixtures/
      has either shape (checked directly: no fixture omits is_decision_maker on
      a human critic, and no fixture's artifact_shapers[] contains a kind=human
      entry)."
    location: packages/schemas/test/fixtures/design-options/v1/fixtures/
    priority: low
manual_verification:
  - id: MV1
    description: "Ran the actual built CLI (packages/cli/dist/main.js) against a
      real design-options/v1 fixture
      (accept-living-twin-discovery-scope-options.json, 2 reviews x 2 shapers,
      one anthropic/claude shaper vs an openai/gpt-5.6-sol critic with a
      different-model shaper too) in a scratch spec-dir/data-dir/config-dir:
      `lane start --design` -> `lane design submit --file <fixture>` -> `lane
      design status`. Confirmed exitCode 0 end-to-end and
      derived_status=same_family_different_model / same_session for the two
      reviews (both new-to-this-fix codes actually firing, not just
      theoretically reachable). Then called evaluateAllReviews() directly
      (against the same real, schema-parsed fixture) via a throwaway script
      against the built dist and printed every review's `.reasons` -- every line
      matches a DESIGN_MESSAGE_CATALOG template's exact wording (e.g. \"does not
      clear the lineage dimension\", lowercase \"not\", distinguishing it from
      the vendored module's own \"does NOT clear\" wording -- positive
      confirmation the text is coming from the catalog, not passed through
      verbatim), and shaper_relation's nested `{reason}` placeholder is itself a
      fully catalogued sub-message (e.g. \"different provider (shaper=anthropic,
      critic=openai)\"), never the vendored module's raw sentence."
    expected_status: PASS -- confirmed exactly as described above; full per-review
      reasons transcript available in this PR's description / commit message.
goal_stopping_condition:
  - rm -f **/*.tsbuildinfo; pnpm run build; pnpm -r run typecheck; pnpm test;
    pnpm run lint all report success from a clean state.
  - pnpm run generate:json-schema produces no working-tree diff (this change
    touches zero files under packages/schemas).
  - packages/core/test/upstream-markers.test.ts's always-run content check
    reports treeHash=match for
    packages/core/src/vendor/derive-independence/UPSTREAM against commit
    36df11adfb361873abbc04ec864aa5a36f8e9d7e.
  - MV1 (manual_verification) passes against a real design-options/v1 fixture,
    not just the synthetic sample records in the unit tests.
