  - ears_rule: R3
    test_type: unit
    test_file: packages/core/src/design-independence.ts
    status: added
    note: "Enforced by the TypeScript compiler, not a test file: the switch in
      mapReasonRecordToDesignMessage is exhaustive over ReasonCode, and its
      `default` branch assigns `record` to a `never`-typed local -- a re-vendor
      that adds a code with no matching `case` fails `pnpm -r run typecheck`,
      not merely a test. design-independence-reason-catalog.test.ts's own
      REASON_CODES.length===20 pin is the runtime companion (see R6)."
  - ears_rule: R4
    test_type: unit
    test_file: packages/core/test/design-independence-reason-catalog.test.ts
    status: added
    note: '"throws (fails closed) for a fabricated record whose code is outside the
