success_criteria_matrix:
  - criterion: evaluateReview() の ReviewEvaluation.reasons が全件
      CatalogBackedDesignMessage になる (vendored derive-independence.mjs
      由来の生文字列が一切混ざらない)
    covered_by: test
    evidence: ReviewEvaluation.reasons is typed CatalogBackedDesignMessage[]
      (design-independence.ts); every element comes from
      mapReasonRecordToDesignMessage, which only ever returns a
      formatDesignMessage(...) result or throws -- there is no code path that
      returns a raw string. packages/cli/test/design-message-cast.test.ts's
      whole-production-source brand-assertion scan (unmodified, still passing)
      independently confirms no `as CatalogBackedDesignMessage` was added to
      mint the brand any other way.
    negation_test: "design-independence-reason-catalog.test.ts's injection test
      shows the negative: a record whose code is NOT in REASON_CODES does not
      silently produce a plain string -- it throws instead, which is the failure
      mode this criterion rules out (a raw/uncatalogued string reaching
      `reasons`)."
  - criterion: vendored derive-independence.mjs の REASON_CODES (closed set) の全 code
      に design-messages.ts の catalog entry が対応することを固定する living-contract テストが存在する
    covered_by: test
    evidence: packages/core/test/design-independence-reason-catalog.test.ts imports
      REASON_CODES from the vendored module directly (never a hand-copied list)
      and iterates it with it.each, asserting each code maps to a non-empty
      message; a separate test pins REASON_CODES.length===20 so a re-vendor that
      changes the set is impossible to silently under-test.
    negation_test: "Manually verified during development: temporarily removing one
      `case` from mapReasonRecordToDesignMessage's switch made `pnpm -r run
      typecheck` fail immediately (the `never` assignment no longer compiles) --
      confirming the exhaustiveness check is real, not decorative."
  - criterion: 未知の reason code (vendor pin 更新漏れ相当) を注入した場合、catalog へのマッピングが
      fail-closed で throw する (プレースホルダーを埋めた文字列を黙って返さない)
    covered_by: test
    evidence: "design-independence-reason-catalog.test.ts's \"throws (fails closed)
      for a fabricated record whose code is outside the vendored REASON_CODES
      set\" constructs {code: \"nonexistent_code\", params: {}} and asserts
      mapReasonRecordToDesignMessage throws with a message naming the
      unrecognized code."
    negation_test: The positive case (a real, known code) is what every other row of
      this same test file exercises -- it does NOT throw for any of the 20 real
      REASON_CODES, so the throw is specific to the unrecognized code, not a bug
      that throws unconditionally.
cross_check_intent_vs_spec:
  performed_at: 2026-08-22 (Phase 3)
  finding: "No direction-2 gap found: intent.yaml's three success criteria map 1:1
    onto spec.md's R1 (catalog-only reasons), R3+R6 (living-contract
    exhaustiveness), and R4+R7 (fail-closed injection) respectively. spec.md
    does not imply anything stronger than intent.yaml already states -- both
    documents agree the scope is limited to ReviewEvaluation.reasons's content
    quality, not to derived_status/qualifying/coverage/establishment decisions
    (R8), which intent.yaml's own scope note already excludes."
