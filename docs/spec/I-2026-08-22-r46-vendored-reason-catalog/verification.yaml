  - ears_rule: R8
    test_type: regression
    test_file: packages/cli/test/design.test.ts
    status: existing
    note: lane design status/submit/decide/override CLI behavior unmodified; 11
      tests pass unmodified.
  - ears_rule: R8
    test_type: regression
    test_file: packages/cli/test/design-status-order.test.ts
    status: existing
