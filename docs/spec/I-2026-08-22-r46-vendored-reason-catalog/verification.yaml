  - ears_rule: R5
    test_type: unit
    test_file: packages/core/test/design-independence-reason-catalog.test.ts
    status: added
    note: '"shaper_relation recurses through its nested inner record via the catalog
      too" -- asserts the composed text embeds the recursively-mapped inner
      reason, not a raw vendored fragment.'
  - ears_rule: R6
    test_type: unit
    test_file: packages/core/test/design-independence-reason-catalog.test.ts
    status: added
    note: Imports REASON_CODES from the vendored module itself (never a hand-copied
