  - ears_rule: R7
    test_type: unit
    test_file: packages/core/test/design-independence-reason-catalog.test.ts
    status: added
    note: Same test as R4 -- R4 is the requirement, R7 is "a test exists for it".
  - ears_rule: R8
    test_type: regression
    test_file: packages/core/test/design-independence.test.ts
    status: existing
    note: 13 tests, all pass unmodified (evaluateReview/summarizeIndependence
