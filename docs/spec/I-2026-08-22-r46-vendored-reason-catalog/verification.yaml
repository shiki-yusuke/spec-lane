test_matrix:
  - ears_rule: R1
    test_type: unit
    test_file: packages/core/test/design-independence-reason-catalog.test.ts
    status: added
    note: it.each over the vendored REASON_CODES asserts every code maps to a
      non-empty catalogued message via mapReasonRecordToDesignMessage.
      packages/core/test/design-independence.test.ts's pre-existing
      ".reasons.some((r) => r.includes(\"involvement\"))" assertion still passes
      unmodified against the new CatalogBackedDesignMessage[] type.
  - ears_rule: R2
    test_type: unit
    test_file: packages/core/test/upstream-markers.test.ts
    status: existing
    note: The always-run, unconditional content-hash check (discovers every UPSTREAM
      marker from the filesystem) now reports
      commit=36df11adfb361873abbc04ec864aa5a36f8e9d7e treeHash=match for
      packages/core/src/vendor/derive-independence/UPSTREAM -- verified directly
      in this task's own test run output.
  - ears_rule: R2
    test_type: unit
    test_file: packages/core/test/pin-verify.test.ts
    status: existing
    note: RECORDED_MJS_HASH/PIN_COMMIT_ON_MAIN updated to the new pin; the
      content-match test and the (opt-in, LANE_UPSTREAM_PLAYBOOK_PATH-gated)
      reachability tests are unmodified in structure, only their pinned
