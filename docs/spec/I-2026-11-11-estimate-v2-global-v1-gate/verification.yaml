test_gaps:
  - taxonomy: observability_gap
    description: The seeded tests prove the route and stored revision, but not the
      production living-twin population. Post-release confirmation is required
      against G5-2b without --reference-*.
    location: packages/cli/src/commands/estimate.ts
    priority: medium
  - taxonomy: manual-diff-check
    description: TEST-07 is a CHANGELOG Unreleased-content review rather than an
      executable assertion; it is recorded below and in AC-05 evidence.
    location: CHANGELOG.md
    priority: low
manual_verification:
  - id: MV-01
    description: "Post-release: on living-twin G5-2b, run lane estimate with a
      cohort profile and --novel-surface established but without --reference-*;
      confirm exit 0 and a predicted estimate/v2-cohort revision whose neighbors
      have record_ids and exclude the target observation."
    expected_status: pending
  - id: MV-02
    description: Run pnpm test, pnpm typecheck, and pnpm lint from the repository
      root; inspect CHANGELOG.md Unreleased for the v2/global-v1 provenance,
      targetIntentId migration, and backward-read-only record_id compatibility.
    expected_status: "passed: pnpm test (schemas 241, core 762 pass/72 skip,
      adapters 68, cli 499), pnpm typecheck exit 0, pnpm lint exit 0, CHANGELOG
      Unreleased"
goal_stopping_condition:
  - lane estimate retains a predicted cohort-matched estimate/v2 decision and
    exits 0 when global v1 raises only ReferenceTableRequiredError, without
    --reference-*.
  - Target-intent observations are excluded before both estimator paths, and
    persisted revision neighbors trace the selected observation record_ids
    without altering the strict estimate/v2 contract.
  - The v2-abstained and reference-table paths remain unchanged; package tests,
    typecheck, lint, and the CHANGELOG Unreleased check are green.
