success_criteria_matrix:
  - criterion: When estimate/v2 decides predicted from the cohort-matched
      population, lane estimate exits 0 and writes a revision carrying that v2
      decision even when the whole-population v1 run would raise
      ReferenceTableRequiredError; no --reference-* flags are needed. A
      regression test with 8 cohort-eligible observations plus nearer
      cohort-less ineligible ones fails on 048715d and passes after the change.
    covered_by: test
    evidence: packages/core/test/estimate-service.test.ts::TEST-01;
      packages/cli/test/estimate.test.ts::exits 0 without --reference-* and
      persists the v2-cohort revision (target self-observation excluded). Both
      use 8 non-target cohort-eligible observations plus nearer cohort-less
      ineligible observations.
    negation_test: "packages/core/test/estimate-service.test.ts::precondition:
      global v1 over the same population raises ReferenceTableRequiredError"
  - criterion: When v2 abstains and no reference table is given, behavior is
      unchanged (abstained revision, same reason codes); when a reference table
      is given, the v1 reference_table path is unchanged.
    covered_by: test
    evidence: "packages/core/test/estimate-service.test.ts::TEST-03: v2 abstains +
      no reference table -> unchanged abstained revision with the existing
      reason codes; TEST-03: v2 abstains + reference table -> unchanged
      global-v1 reference_table revision"
    negation_test: The no-reference case asserts predicted is undefined and
      INSUFFICIENT_POPULATION; the reference-table case asserts its supplied
      predicted value and method reference_table.
  - criterion: Observations whose intent_id equals the estimated intent are excluded
      from both the v1 and v2 populations, asserted by a test where the target's
      own observation would otherwise be the nearest neighbor (distance 0).
    covered_by: test
    evidence: "packages/core/test/estimate-service.test.ts::TEST-04: the target's
      own distance-0 observation is excluded from both the v1 neighbors and the
      decision_v2 population"
    negation_test: TEST-04 asserts no target intent_id or cal-self record_id in v1
      neighbors, 8 v2 candidates/eligible observations, and nearest_distance >
      0.
  - criterion: The persisted v2 decision (or the revision) lets an operator trace a
      v2 prediction to the record_ids of the observations it used, without a
      breaking change to the vendored estimate/v2 contract; if the contract
      cannot carry it compatibly, Phase 2 records that and moves this criterion
      to a follow-up intent instead of changing the contract.
    covered_by: test
    evidence: "packages/core/test/estimate-service.test.ts::TEST-05: revision
      neighbors carry the exact selected observation record_ids; decision_v2
      stays strict; packages/schemas/test/estimate.test.ts::persists the exact
      neighbor record_id; still parses an old revision whose neighbors have no
      record_id (backward-read compatible)."
    negation_test: packages/schemas/test/estimate.test.ts::the strict estimate/v2
      decision contract still rejects a neighbor record_id
  - criterion: All packages/* test suites, typecheck and biome stay green; CHANGELOG
      has an Unreleased entry.
    covered_by: manual
    evidence: pnpm test (schemas 241, core 762 pass/72 skip, adapters 68, cli 499),
      pnpm typecheck exit 0, pnpm lint exit 0, CHANGELOG Unreleased.
    negation_test: Any package-test, typecheck, or lint failure returns non-zero;
      MV-02 requires the Unreleased entry to state the specified provenance and
      compatibility conditions.
cross_check_intent_vs_spec:
  performed_at: 2026-11-13 (Phase 4 verification)
  finding: The five criterion strings above are copied verbatim from intent.yaml
    intent.success. spec.md RULE-01..06 and TEST-01..07 refine implementation
    and verification routes without adding a success condition beyond those five
    intent outcomes. RULE-02 is separately covered because it is an
    error-propagation safeguard, not an additional intent success criterion. No
    divergence found.
