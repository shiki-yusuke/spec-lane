success_criteria_matrix:
  - criterion: After a passing 3_implement->4_verify advance whose intent configures
      external_verify, lane-state.json satisfies updated_at >=
      gate_snapshots.external_verify.recorded_at, asserted by an automated test
      under packages/cli/test that fails against the pre-fix code.
    covered_by: test
    evidence: packages/cli/test/external-verify.test.ts::TEST-80 EARS-01 assert;
      MV-01 shows it red on HEAD b726d92
    negation_test: "MV-01: the same test against the pre-fix advance.ts fails with
      `expected false to be true` (recorded_at 25 ms after updated_at)"
  - criterion: Every timestamp a single advance writes for the transition itself --
      updated_at, the ended phase's ended_at, the new phase's started_at, and
      the premise_evidence / success_criteria snapshot recorded_at when those
      are written -- is one identical instant, taken only after every gate has
      passed; a gate error still leaves lane-state.json byte-identical.
    covered_by: test
    evidence: TEST-80 toBe(updated_at) on ended_at / started_at /
      success_criteria.recorded_at; TEST-05/TEST-41 byte-identity on gate error;
      premise_evidence edge in test_gaps (trivially equal, same variable)
    negation_test: TEST-05/TEST-41 exit 3 with byte-identical file; TEST-80 would
      fail if any of the three stamps used a different Date() call (toBe is
      exact string equality)
  - criterion: gate_snapshots.external_verify.recorded_at keeps meaning the verifier
      process's own completion time (the runner's finishedAt); it is not
      rewritten to updated_at.
    covered_by: diff
    evidence: "advance.ts hunk 3 changes only the comment above `recorded_at:
      externalVerify.finishedAt`; the assignment line is untouched (git diff).
      TEST-80 asserts recorded_at is a parseable instant."
    negation_test: If recorded_at were assigned `now`, TEST-80's EARS-01 assert
      would still pass, so the guard here is the diff review (hunk 3 comment +
      unchanged assignment) plus TEST-04/TEST-21's digest/exit_status checks --
      recorded as covered_by diff, not test
  - criterion: The existing packages/cli test suite (including
      external-verify.test.ts) stays green and no schema, profile, or CLI flag
      changes.
    covered_by: test
    evidence: "MV-02: pnpm test all packages green (cli 348 incl. 44 in
      external-verify.test.ts); the only source/test files in the diff are
      advance.ts and external-verify.test.ts; the other changed files are this
      lane's docs/spec artifacts"
    negation_test: "git diff --stat: 2 source/test files plus this lane's 5
      artifacts under docs/spec/I-2026-09-03-advance-timestamp-order/;
      packages/schemas, profiles/, and packages/cli/src/main.ts untouched"
cross_check_intent_vs_spec:
  performed_at: 2026-09-03 (Phase 3, after the final diff)
  finding: "spec.md D5 became stronger mid-lane (dd gate as external_verify +
    lane-cwd edits after the guard incident) and intent.yaml
    constraints/non_goal were updated to match before 3_implement. spec.md D2
    (evaluated_at stays pre-gate) is already intent.yaml non_goal +
    known_affected_behavior. No condition in spec.md/verification.yaml is
    stronger than intent.yaml now states. Cross-check table re-checked against
    the final diff: only PATH-01/PATH-02 (advance.ts) changed; PATH-03..06
    untouched."
