    reviewer_id: fable5-dd-session-ed5fb77a
    acked_at: 2026-09-03T09:04:43.189Z
    spec_sha256: 88fe0343333a013308f3b0c0fa8eaf6be9693ab83b6b859900b2f0a7f1102a18
