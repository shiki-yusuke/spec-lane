    expected_status: "expected: TEST-80 red on the EARS-01 assert, other 43 green --
      pass 2026-09-03: 1 failed | 43 passed, failure = `expected false to be
      true` at `state.updated_at >= recorded_at`"
  - id: MV-02
    description: Fix applied from a lane-cwd headless session (4c7b35f1) under dd
      run run-0eb3b769; `cmp packages/cli/src/commands/advance.ts <reviewed
      patch result>`; then pnpm typecheck / lint / test at the repo root
    expected_status: "expected: file identical to the sol-reviewed fix; all green --
      pass 2026-09-03: cmp identical; tsc -b clean; biome 205 files clean (after
      import-order fix, session 705c27d5); tests schemas 217 / core 619 (3
      skipped) / adapters 45 / cli 348, all passed"
  - id: MV-03
    description: "dd hooks observed the edits: .dd/ledger.jsonl rows for task_id
      I-2026-09-03-advance-timestamp-order"
    expected_status: "expected: run_open, session_start per headless session,
      scope-edit observations not_detected -- pass 2026-09-03 (checked after
      session 1): run_open run-0eb3b769, session_start 97e490d7, scope-edit
      not_detected x2 (the two Edits), pipe rules warn/not_detected. Sessions
      4c7b35f1 / 705c27d5 rows are evaluated by dd gate itself at this
