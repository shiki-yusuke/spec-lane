schema_version: "1.0"
intent_id: I-2026-09-03-advance-timestamp-order
test_matrix:
  - ears_rule: "EARS-01: after a passing 3_implement->4_verify with external_verify,
      updated_at >= gate_snapshots.external_verify.recorded_at"
    test_type: regression
    test_file: packages/cli/test/external-verify.test.ts
    test_name: "TEST-80 (issue #38): updated_at never predates the external_verify
      snapshot, and one instant stamps the whole transition"
    status: added
    note: "Real child sleeps 25 ms then exits 0. Red against HEAD b726d92
      (AssertionError: expected false to be true on the EARS-01 assert, observed
      2026-09-03 before the fix was applied), green after the fix."
  - ears_rule: "EARS-02: one identical write instant for updated_at,
      phase_history[from].ended_at, phase_history[to].started_at, and the
      success_criteria snapshot recorded_at"
    test_type: regression
    test_file: packages/cli/test/external-verify.test.ts
    test_name: "TEST-80 (issue #38) -- toBe(updated_at) on both phase boundaries and
      on gate_snapshots.success_criteria.recorded_at"
    status: added
    note: The success_criteria snapshot is produced by an in-test verification.yaml
      fixture matching runStart's default criterion (2026-09-03 design review
      BLOCKER, sol). premise_evidence snapshot (1_intent->2_spec) not separately
      tested, see test_gaps.
  - ears_rule: "EARS-03: when a gate errors, lane-state.json stays byte-identical"
    test_type: integration
    test_file: packages/cli/test/external-verify.test.ts
    test_name: "TEST-05/TEST-41: a non-zero exit refuses the transition and leaves
      lane-state.json byte-identical"
    status: existing
    note: "Unchanged test, still green: the write instant is now captured inside the
      region that already wrote nothing on error."
  - ears_rule: "EARS-04: gate_snapshots.external_verify.recorded_at remains the
      runner's finishedAt"
    test_type: regression
    test_file: packages/cli/test/external-verify.test.ts
    test_name: "TEST-80 (issue #38) -- recorded_at truthy and ISO-parseable;
      TEST-04/TEST-21 records the snapshot"
    status: added
    note: "No inequality with updated_at is asserted (spec L2: same millisecond is
      legal). The diff does not touch the line writing
      externalVerify.finishedAt, only its comment."
test_gaps:
  - taxonomy: test_missing
    description: gate_snapshots.premise_evidence.recorded_at == updated_at on the
      1_intent->2_spec edge has no dedicated assertion. No external command runs
      on that edge, so the equality held before the fix and holds after it (same
      `now`); asserting it would not distinguish the two versions.
    location: packages/cli/src/commands/advance.ts
    priority: low
  - taxonomy: wrong_assumption
    description: A wall-clock step backwards between the runner's finishedAt and the
      write instant could still invert the two stamps (spec L1). Not defended
      anywhere in lane; out of scope.
    location: packages/cli/src/commands/advance.ts
    priority: low
