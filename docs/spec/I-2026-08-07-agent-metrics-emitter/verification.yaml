success_criteria_matrix:
  - criterion: lane emit-metrics <intent-id> prints a valid
      agent-metrics:v1/token-usage:v1 marker to stdout (diagnostics go to
      stderr) that a compliant harvester accepts under the published contract's
      own verify-fixtures.mjs checks (schema, sha256, upsert_key recipe,
      personal-dimension scan, limits).
    covered_by: test
    evidence: packages/core/test/agent-metrics-fixtures.test.ts (12/12 vendored
      fixtures pass); packages/cli/test/e2e.test.ts::prints a well-formed
      agent-metrics:v1 marker
    negation_test: packages/core/test/metrics-service.test.ts::decodeAndVerifyAgentMetricsMarker
      rejects a tampered marker (sha256 no longer matches)
  - criterion: lane emit-metrics <intent-id> --post [--pr N] posts the marker as a
      PR comment, and re-running it against the same emitter+subject updates
      (upserts) the existing comment instead of creating a duplicate.
    covered_by: test
    evidence: packages/adapters/test/metrics-github-comment.test.ts::updates the
      existing comment whose decoded upsert_key matches, rather than creating a
      duplicate
    negation_test: packages/adapters/test/metrics-github-comment.test.ts::does not
      match a comment whose marker decodes to a different subject (different
      upsert_key)
  - criterion: If any KPI-eligible ledger entry's session_ids overlap across more
      than one activity, the whole emit fails with reason
      ambiguous_session_attribution and nothing is posted (no partial emit).
    covered_by: test
    evidence: packages/core/test/metrics-service.test.ts::flags a session id that
      appears in more than one activity (fail-closed);
      packages/cli/test/emit-metrics.test.ts::aborts with
      ambiguous_session_attribution and prints nothing when a session id spans
      two activities
    negation_test: packages/core/test/metrics-service.test.ts::returns empty when no
      session id is shared across activities
  - criterion: Entries that cannot be honestly attributed a breakdown (manual
      source, no session_ids, or agent-cost has no matching rows) are never
      fabricated into a record; they are recorded in data.coverage.omissions
      with a machine-readable reason code, and coverage.status reflects the
      difference (no_data when nothing measurable exists, partial when some
      entries are omitted, complete when none are).
    covered_by: test
    evidence: packages/core/test/metrics-service.test.ts::reports manual-source
      entries as structural omissions / buildCoverage's complete/partial/no_data
      tests; packages/cli/test/emit-metrics.test.ts::records a manual-source
      entry as an omission, never fabricating a record for it
    negation_test: packages/core/test/metrics-service.test.ts::maps a well-formed
      row into a token-usage record (a genuinely attributable entry does get a
      real record, not an omission)
  - criterion: An unknown token_kind, an agent-cost measure/v1 protocol mismatch, a
      schema violation, or a personal-dimension violation aborts the entire emit
      (nothing printed to stdout, nothing posted) rather than emitting a partial
      or non-conformant payload.
    covered_by: test
    evidence: packages/cli/test/emit-metrics.test.ts::aborts with unknown_token_kind
      / aborts cleanly when agent-cost reports a measure protocol other than
      measure/v1; packages/core/test/metrics-service.test.ts::rejects a
      personal-dimension key / rejects rather than truncates over the 64 KB
      limit
    negation_test: packages/core/test/metrics-service.test.ts::never collapses
      cache_write_5m/1h/unknown into one bucket (proves a well-formed,
      recognized token_kind is accepted, not rejected)
