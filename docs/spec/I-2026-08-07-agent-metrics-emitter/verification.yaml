test_gaps:
  - taxonomy: manual-verification-required
    description: --post's actual `gh api` PATCH/POST calls are only tested against a
      fake `gh` script (packages/adapters/test/metrics-github-comment.test.ts),
      never against a real GitHub PR in CI -- that would require live GitHub
      resources, out of scope for automated tests.
    location: packages/adapters/src/metrics/github-comment.ts
    priority: medium
manual_verification:
  - id: post-real-pr
    description: After this PR is open, run `lane emit-metrics
      I-2026-08-07-agent-metrics-emitter --post` against the real PR once, and
      confirm a comment appears; run it a second time and confirm the same
      comment updates in place rather than a second one appearing.
    expected_status: pending
goal_stopping_condition:
  - pnpm biome check . / pnpm -r run typecheck / pnpm -r run build /
    dependency-cruiser / pnpm -r run test all green
  - All 5 intent.intent.success lines have a corresponding
    success_criteria_matrix row with real evidence
  - PR opened against the feature branch, containing a real, reviewable diff
