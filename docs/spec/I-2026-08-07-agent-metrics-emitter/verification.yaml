    test_file: packages/core/test/agent-metrics-fixtures.test.ts
    test_name: all 12 vendored fixtures resolve to their expected-results.json outcome
    status: added
  - ears_rule: Rule 1 (schema-conformant output)
    test_type: unit
    test_file: packages/core/test/metrics-service.test.ts
    test_name: "golden reproduction: fixture ledger + fake measure/v1 rows reproduce
      valid-minimum.json's own data shape field-for-field"
    status: added
  - ears_rule: Rule 2 (correct upsert identity)
    test_type: unit
    test_file: packages/core/test/agent-metrics-fixtures.test.ts
    test_name: upsert_key recomputation matches every vendored fixture's own
