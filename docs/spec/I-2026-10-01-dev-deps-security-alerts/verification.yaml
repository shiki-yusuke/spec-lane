success_criteria_matrix:
  - criterion: Root package.json and all four packages/*/package.json declare vitest
      ^4.1.11, and pnpm-lock.yaml resolves vitest and @vitest/mocker to 4.1.11
      or later with no vitest 2.x or vite 5.x entry left in the lockfile.
    covered_by: diff
    evidence: TEST-03 (five ^4.1.11 hunks) + TEST-05 (0 stale entries;
      vitest@4.1.11, @vitest/mocker@4.1.11 in pnpm-lock.yaml).
    negation_test: TEST-05 grep on the pre-change lockfile counts 4 stale entries
      (vite@5.4.21, esbuild@0.21.5, fast-uri@3.1.4 x2 sections), so the check is
      not vacuous.
  - criterion: pnpm-lock.yaml resolves fast-uri to 3.1.7 or later while
      dependency-cruiser and ajv keep their current resolved versions (16.10.4
      and 8.20.0).
    covered_by: diff
    evidence: "pnpm-lock.yaml: fast-uri@3.1.8, dependency-cruiser@16.10.4,
      ajv@8.20.0; TEST-04 pnpm depcheck exit 0."
    negation_test: TEST-02 on the pre-change lockfile reports the 5 fast-uri alerts
      UNSATISFIED (resolved 3.1.4).
  - criterion: No `dependencies` (production) entry changes in any package.json, and
      the lockfile's importer `dependencies` blocks are byte-identical before
      and after.
    covered_by: diff
    evidence: "TEST-03: package.json hunks are the vitest line only; lockfile diff
      lines outside devDependencies hunks: none; git diff main --stat lists
      package.json x5, pnpm-lock.yaml, CHANGELOG.md, docs/spec/** only."
    negation_test: The same hunk filter applied to the vitest lines does report them
      (devDependencies), confirming the filter sees hunks when they exist.
  - criterion: Every one of the 23 open Dependabot alerts has its
      first_patched_version satisfied by the version pnpm-lock.yaml now resolves
      for that package (checked with a script against the alert list before the
      PR), so the alert count reaches 0 once the PR merges.
    covered_by: test
    evidence: "TEST-02 alert-check.mjs: total=23 unsatisfied=0, exit 0 on the new
      lockfile; post-merge count is MV-01."
    negation_test: "TEST-02 against the pre-change lockfile: total=23 unsatisfied=23, exit 1."
  - criterion: pnpm typecheck, pnpm lint and pnpm test exit 0 on the upgraded
      toolchain, with no fewer passing test files (99) and passing tests (1396)
      than before the change and no test file edited to get there.
    covered_by: test
    evidence: "TEST-01: exit codes 0/0/0; 99 passed files, 1396 passed tests, 72
      skipped, identical to baseline; no test path in the diff."
    negation_test: "Spec Gherkin negative scenario: a red test would have stopped
      the lane (intent constraint 1); the counts are compared to the recorded
      baseline so a dropped suite would show as fewer files."
  - criterion: CHANGELOG.md gains an Unreleased entry naming the vitest major move
      and the fast-uri resolution.
    covered_by: diff
    evidence: "CHANGELOG.md: new '## Unreleased' / '### Changed' bullet above '##
      0.11.0' naming vitest ^2.1.8 -> ^4.1.11, vite 8.x, esbuild pin, fast-uri
      3.1.8, 23 alerts."
    negation_test: Before the edit `grep -c Unreleased CHANGELOG.md` was 0 (asserted
      by the edit script before inserting).
cross_check_intent_vs_spec:
  performed_at: 2026-10-01 (Phase 3, after TEST-01..05)
  finding: 'Direction 2: spec.md D1-D5 and RULE-01..07 state nothing stronger than
    intent.yaml success 1-6; the one stronger observation (vite resolved to
    8.3.1 and esbuild collapsed onto the root 0.28.1 pin, beyond the ">=6.4.3"
    floor) is a consequence, not a criterion, and is recorded in the CHANGELOG
    entry and the consensus deviation instead of tightening intent.yaml.'
