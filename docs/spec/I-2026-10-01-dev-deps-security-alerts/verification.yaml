schema_version: "1.0"
intent_id: I-2026-10-01-dev-deps-security-alerts
test_matrix:
  - ears_rule: "RULE-01: root and four package.json declare vitest ^4.1.11"
    test_type: regression
    test_file: package.json, packages/*/package.json
    test_name: "TEST-03: git diff main -- package.json packages/*/package.json shows
      exactly five -^2.1.8/+^4.1.11 hunks"
    status: added
    note: "Observed 2026-10-01: 5 files, 1 hunk each, devDependencies only."
  - ears_rule: "RULE-02: lockfile resolves vitest/@vitest/mocker >=4.1.11, no
      vitest@2. or vite@5. entry"
    test_type: regression
    test_file: pnpm-lock.yaml
    test_name: "TEST-05: grep -cE
      '^  '?(vitest@2\\.|vite@5\\.|esbuild@0\\.21|fast-uri@3\\.1\\.4)'
      pnpm-lock.yaml == 0; node_modules/.bin/esbuild --version == 0.28.1"
    status: added
    note: "Observed: 0 stale entries; vitest@4.1.11, @vitest/mocker@4.1.11,
      vite@8.3.1; esbuild 0.28.1."
  - ears_rule: "RULE-03: fast-uri >=3.1.7, dependency-cruiser 16.10.4 and ajv 8.20.0
      unchanged"
    test_type: regression
    test_file: pnpm-lock.yaml
    test_name: "TEST-04: pnpm depcheck exits 0 (dependency-cruiser loads ajv ->
      fast-uri at runtime); lock grep fast-uri@3.1.8,
      dependency-cruiser@16.10.4, ajv@8.20.0"
    status: added
    note: "depcheck: no dependency violations found (190 modules, 672 dependencies
      cruised)."
  - ears_rule: "RULE-04: no production dependencies block changes (package.json or
      lockfile importers)"
    test_type: regression
    test_file: pnpm-lock.yaml
    test_name: "TEST-03: lockfile diff hunks filtered for lines not under
      devDependencies -> none; package.json hunks touch only the vitest line"
    status: added
  - ears_rule: "RULE-05: typecheck, lint, test exit 0 with >=99 passed files /
      >=1396 passed tests, no test file edited"
    test_type: regression
    test_file: packages/*/test/**
    test_name: "TEST-01: pnpm typecheck (0), pnpm lint (0, 223 files), pnpm test (0;
      schemas 13/225, core 42+5skip/664+72skip, adapters 9/68, cli 35/439 = 99
      files, 1396 tests, identical to the 2.1.9 baseline)"
    status: existing
    note: git diff main --stat shows no packages/*/test or packages/*/src path.
  - ears_rule: "RULE-06: every open Dependabot alert's first_patched_version is
      satisfied by the lockfile"
    test_type: integration
    test_file: scratchpad alert-check.mjs (gh api alerts?state=open joined with
      lockfile package keys)
    test_name: "TEST-02: 23/23 satisfied on the new lockfile (exit 0); negative run
      on the pre-change lockfile: 23/23 UNSATISFIED (exit 1)"
    status: added
    note: Alert count itself can only reach 0 after merge to main (Dependabot
      re-scans the default branch); see MV-01.
  - ears_rule: "RULE-07: CHANGELOG Unreleased entry names the vitest major move and
      fast-uri"
    test_type: manual
    test_file: CHANGELOG.md
    test_name: "grep -n 'Unreleased' CHANGELOG.md -> heading above ## 0.11.0; entry
      names vitest ^4.1.11, vite 8.x, esbuild pin, fast-uri 3.1.8, 23 alerts"
    status: added
test_gaps:
  - taxonomy: context_variant_missed
    description: TEST-01 ran on macOS arm64 only; CI (ubuntu, Node 22) is the second
      platform and runs the same scripts on pnpm install --frozen-lockfile. vite
      8 / rolldown / lightningcss ship platform binaries, so a linux-only
      resolution problem would surface only in CI.
    location: .github/workflows/ci.yml
    priority: low
  - taxonomy: observability_gap
    description: No in-repo test asserts the Dependabot alert count; TEST-02 is a
      one-off script kept outside the repo (allowed_paths excludes scripts/).
    priority: low
manual_verification:
  - id: MV-01
    description: After the PR merges, `gh api
      'repos/shiki-yusuke/lane/dependabot/alerts?state=open' --jq length`
      returns 0 (Dependabot closes alerts once the default branch lockfile no
      longer contains a vulnerable version).
    expected_status: pending until merge (pre-merge proxy TEST-02 = 23/23 satisfied)
  - id: MV-02
    description: "CI run on the PR: lint, build, typecheck, dependency-cruiser and
      test jobs green on ubuntu / Node 22 with --frozen-lockfile."
    expected_status: pending until PR CI completes
goal_stopping_condition:
  - Every RULE-01..07 has a test_matrix row; only RULE-07 is manual.
  - pnpm typecheck, pnpm lint, pnpm test, pnpm depcheck all exit 0 on the final
    commit with test counts equal to the 2.1.9 baseline.
  - TEST-02 reports 23/23 satisfied on the committed lockfile and 23/23
    unsatisfied on the pre-change lockfile.
  - "success_criteria_matrix has no covered_by: none row."
  - Codex builder review (gpt-5.6-terra) returns 可 or 修正後可 with every must item
    resolved before the PR opens.
