      actual: pnpm update fast-uri (also with --depth Infinity) and pnpm install
        --fix-lockfile kept the stale peer resolution vite@5.4.21 and
        fast-uri@3.1.4; the lockfile entries vite@5.4.21, esbuild@0.21.5,
        @esbuild/*@0.21.5, fast-uri@3.1.4 and the vitest/@vitest/mocker@4.1.11
