name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # I-2026-08-18-design-critic-injection R39/R40 -- this repo vendors
      # contracts/shared/derive-independence.mjs and the design-options/v1 contract from
      # ai-agent-skills-playbook (see packages/core/src/vendor/derive-independence/UPSTREAM
      # and packages/schemas/test/fixtures/design-options/UPSTREAM). The pinned commit's
      # reachability from upstream `main` can only be checked with a local checkout of that
      # repo, which this repo's own CI is the right place to provide (R39's own "in CI"
      # wording) -- end users of the published npm package have no such checkout and this
      # check stays opt-in for them (LANE_UPSTREAM_PLAYBOOK_PATH unset -> "unknown", not a
      # false pass; see packages/core/src/pin-verify.ts). `fetch-depth: 0` (full history) is
      # required for `git merge-base --is-ancestor` to work at all. Pinned by commit SHA
      # (not a floating tag) because this step checks out code from a DIFFERENT repository
      # than the one CI is running in.
      - name: Checkout upstream contracts repo (design-critic pin verification, R39/R40)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: shiki-yusuke/ai-agent-skills-playbook
          path: .upstream/ai-agent-skills-playbook
          fetch-depth: 0

      # Differential tests (packages/core/test/differential) call a private Python
      # reference implementation this repo was ported from (design.md §9 checkpoint 3 /
      # §10) via subprocess. That package isn't published anywhere CI (or a fresh clone)
      # can install it from, so these tests self-skip when it isn't importable
      # (python-harness.ts's isPythonReferenceAvailable()) rather than requiring CI setup
      # for it. A maintainer with local access to the reference implementation can still
      # run them by pointing LANE_DIFFERENTIAL_PYTHON_BIN at an interpreter that has it
      # installed.

      - name: Lint (Biome)
        run: pnpm run lint

      # `pnpm run build` (== `pnpm -r --if-present run build`), NOT a bare `tsc -b
      # tsconfig.json`: a raw project-references build only runs the TypeScript compiler,
      # it does not run each package's own package.json "build" script -- and
      # packages/core's "build" script does more than tsc (it cpSync's the vendored
      # derive-independence.mjs into dist/vendor/..., see packages/core/package.json).
      # `Test (all packages)` below imports @lane/core through its package.json "main"
      # (./dist/index.js), which statically imports that vendored file relatively -- a bare
      # `tsc -b` build was verified (2026-08-19) to leave dist/vendor/ empty, which makes
      # every downstream package's test suite fail at module-load time
      # ("Failed to load url ./vendor/derive-independence/v1/derive-independence.mjs").
      - name: Build (all packages, via each package's own build script)
        run: pnpm run build

      - name: Typecheck (src + test, all packages)
        run: pnpm -r run typecheck

      - name: Regenerate JSON Schema and diff against committed output
        run: |
          pnpm --filter @lane/schemas run generate:json-schema
          git diff --exit-code -- packages/schemas/generated || {
            echo "::error::generated/*.schema.json is out of date. Run 'pnpm --filter @lane/schemas run generate:json-schema' and commit the result.";
            exit 1;
          }

      - name: Dependency direction / cycle check (dependency-cruiser)
        run: pnpm exec dependency-cruiser --config .dependency-cruiser.cjs packages/schemas/src packages/core/src packages/adapters/src packages/cli/src

      - name: Test (all packages)
        env:
          LANE_UPSTREAM_PLAYBOOK_PATH: ${{ github.workspace }}/.upstream/ai-agent-skills-playbook
        run: pnpm -r run test
